#
# openi2pd: latest Homebrew toolchain.
#
# Installs the newest GCC, LLVM, CMake, Ninja, Perl, Boost, OpenSSL,
# zlib, MiniUPnPc and ncurses available from Homebrew on Linux. Stable
# command names and CMake/runtime hints are exposed through a per-run
# file.
#
---
name: Latest Homebrew toolchain
description: Install latest GCC, LLVM, CMake, Ninja, Perl, Boost, OpenSSL and dependencies.
inputs:
  compilers:
    description: Install and expose GCC and LLVM as well as CMake/Ninja.
    required: false
    default: 'true'
  libraries:
    description: Install Boost, OpenSSL, zlib, MiniUPnPc and ncurses.
    required: false
    default: 'true'
  openssl:
    description: >-
      Homebrew OpenSSL formula to expose as OPENSSL_ROOT_DIR. The dedicated
      Linux lanes pass openssl@3 or openssl@4 explicitly; everything else
      keeps the latest 4.x default.
    required: false
    default: 'openssl@4'
runs:
  using: composite
  steps:
    - name: Install latest toolchain
      shell: bash
      env:
        INSTALL_COMPILERS: ${{ inputs.compilers }}
        INSTALL_LIBRARIES: ${{ inputs.libraries }}
        OPENSSL_FORMULA: ${{ inputs.openssl }}
      run: |  # zizmor: ignore[github-env] values come from Homebrew and a validated formula allowlist; manual-only workflows
        set -euo pipefail
        if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
          echo 'Homebrew is not available at /home/linuxbrew/.linuxbrew/bin/brew' >&2
          exit 1
        fi
        case "$OPENSSL_FORMULA" in
          openssl@3|openssl@4) ;;
          *) echo "unsupported OpenSSL formula: $OPENSSL_FORMULA" >&2; exit 1 ;;
        esac
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
        brew update
        packages='cmake ninja pkgconf perl'
        if [ "$INSTALL_COMPILERS" = 'true' ]; then
          packages="$packages gcc llvm"
        fi
        if [ "$INSTALL_LIBRARIES" = 'true' ]; then
          packages="$packages boost $OPENSSL_FORMULA miniupnpc ncurses zlib"
        fi

        # Install first, then upgrade so a formula preinstalled in the
        # runner image is replaced with the current Homebrew bottle.
        # Query each formula explicitly: an unconditional upgrade exits
        # non-zero when a selected package is already current. The
        # outdated list is captured instead of piped into `grep -q`:
        # under `set -o pipefail` the early reader exit could hand brew
        # a SIGPIPE and be misread as "already current", and a genuine
        # `brew outdated` failure must not be swallowed.
        brew install $packages
        for package in $packages; do
          if ! outdated="$(brew outdated --quiet "$package")"; then
            echo "brew outdated failed for $package" >&2
            exit 1
          fi
          for outdated_formula in $outdated; do
            if [ "$outdated_formula" = "$package" ]; then
              brew upgrade "$package"
              break
            fi
          done
        done

        prefix="$(brew --prefix)"
        toolchain_bin="${RUNNER_TEMP}/openi2pd-toolchain/bin"
        mkdir -p "$toolchain_bin"
        ln -sfn "${prefix}/bin/cmake" "${toolchain_bin}/cmake"
        ln -sfn "${prefix}/bin/ninja" "${toolchain_bin}/ninja"
        if [ -x "${prefix}/bin/pkg-config" ]; then
          ln -sfn "${prefix}/bin/pkg-config" "${toolchain_bin}/pkg-config"
        fi
        # Use the Homebrew Perl in every job that tests the latest
        # Homebrew dependency set. CMake's find_package(Perl) and the
        # shell steps then agree, and prove runs with the same
        # interpreter as perl.
        perl_prefix="$(brew --prefix perl)"
        for tool in perl prove; do
          if [ -x "${perl_prefix}/bin/${tool}" ]; then
            ln -sfn "${perl_prefix}/bin/${tool}" "${toolchain_bin}/${tool}"
          else
            echo "Homebrew Perl is missing ${perl_prefix}/bin/${tool}" >&2
            exit 1
          fi
        done

        ld_path="${LD_LIBRARY_PATH:-}"
        if [ "$INSTALL_COMPILERS" = 'true' ]; then
          gcc_prefix="$(brew --prefix gcc)"
          llvm_prefix="$(brew --prefix llvm)"
          binutils_prefix="$(brew --prefix binutils)"
          gcc_version="$(brew list --versions gcc | awk '{print $2}' | cut -d. -f1)"
          if [ -z "$gcc_version" ]; then
            echo 'Unable to determine the installed GCC major version' >&2
            exit 1
          fi
          ln -sfn "${gcc_prefix}/bin/gcc-${gcc_version}" "${toolchain_bin}/gcc"
          ln -sfn "${gcc_prefix}/bin/g++-${gcc_version}" "${toolchain_bin}/g++"
          ln -sfn "${llvm_prefix}/bin/clang" "${toolchain_bin}/clang"
          ln -sfn "${llvm_prefix}/bin/clang++" "${toolchain_bin}/clang++"
          # GCC 16 emits newer assembler directives than the Ubuntu
          # binutils; keep the matching Homebrew binutils first on PATH.
          for tool in as ld ar ranlib nm objcopy strip; do
            if [ -x "${binutils_prefix}/bin/${tool}" ]; then
              ln -sfn "${binutils_prefix}/bin/${tool}" "${toolchain_bin}/${tool}"
            fi
          done
          ld_path="${gcc_prefix}/lib64:${gcc_prefix}/lib:${llvm_prefix}/lib:${ld_path}"
        fi
        if [ "$INSTALL_LIBRARIES" = 'true' ]; then
          boost_prefix="$(brew --prefix boost)"
          openssl_prefix="$(brew --prefix "$OPENSSL_FORMULA")"
          miniupnpc_prefix="$(brew --prefix miniupnpc)"
          ncurses_prefix="$(brew --prefix ncurses)"
          zlib_prefix="$(brew --prefix zlib)"
          {
            echo "BOOST_ROOT=${boost_prefix}"
            echo "OPENSSL_ROOT_DIR=${openssl_prefix}"
            echo "ZLIB_ROOT=${zlib_prefix}"
            echo "CMAKE_PREFIX_PATH=${boost_prefix}:${openssl_prefix}:${miniupnpc_prefix}:${ncurses_prefix}:${zlib_prefix}:${CMAKE_PREFIX_PATH:-}"
            echo "CMAKE_INCLUDE_PATH=${ncurses_prefix}/include:${CMAKE_INCLUDE_PATH:-}"
            echo "CMAKE_LIBRARY_PATH=${ncurses_prefix}/lib:${CMAKE_LIBRARY_PATH:-}"
            echo "PKG_CONFIG_PATH=${boost_prefix}/lib/pkgconfig:${openssl_prefix}/lib/pkgconfig:${miniupnpc_prefix}/lib/pkgconfig:${ncurses_prefix}/lib/pkgconfig:${zlib_prefix}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          } >> "$GITHUB_ENV"
          ld_path="${zlib_prefix}/lib:${miniupnpc_prefix}/lib:${ncurses_prefix}/lib:${openssl_prefix}/lib:${boost_prefix}/lib:${prefix}/lib:${ld_path}"
        fi

        if [ -n "$ld_path" ]; then
          echo "LD_LIBRARY_PATH=${ld_path}" >> "$GITHUB_ENV"
        fi
        echo "${toolchain_bin}" >> "$GITHUB_PATH"
        export PATH="${toolchain_bin}:${PATH}"

        cmake --version | head -1
        ninja --version
        perl --version | sed -n '1,2p'
        if [ "$INSTALL_COMPILERS" = 'true' ]; then
          gcc --version | head -1
          clang --version | head -1
        fi
        for package in $packages; do
          brew list --versions "$package"
        done
