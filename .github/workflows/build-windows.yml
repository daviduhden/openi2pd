name: Windows

# Automatic runs are intentionally suspended during the refactoring. Only a
# maintainer may start this workflow manually from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
      - name: Build and run basic tests
        run: |
          cmake -S build -B build-output -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-output --parallel 2 --target i2pd keygen keyinfo i2pbase64 regaddr verifyhost offlinekeys x25519 test-tui-protocol test-http-url test-http-req test-base-64 test-aes test-aeadchacha20poly1305
          ctest --test-dir build-output --output-on-failure --timeout 60 -R '^(test-(tui-protocol|http-url|http-req|base-64|aes|aeadchacha20poly1305)|tools-smoke)$'
