# license details.
#
# openi2pd: build windows.
#
# Configures build and manual CI integration.
#

---
name: Windows

# Automatic runs are intentionally suspended during the refactoring.
# Only a maintainer may start this workflow manually from the Actions
# tab.
on:
  workflow_dispatch:
    inputs:
      heap_diagnostics:
        description: Run targeted MSVC tests under installed CDB/PageHeap
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # MSYS2/Clang64 validates the full dependency set and the Win32 TUI
  # backend with the same toolchain used for the distribution helper.
  build:
    name: Windows MSYS2 Clang64 build and tests
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      # Deep-copy emulation is not a symlink containment test.
      MSYS: winsymlinks:nativestrict
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: CLANG64
          update: true
          install: >-
            perl
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-binutils
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
      - name: Configure and build
        run: |  # zizmor: ignore[misfeature] required by the MSYS2 Clang64 toolchain supplied by setup-msys2
          # Native Strawberry Perl uses different path encoding rules.
          # Select the MSYS host interpreter for the full UTF-8 contract.
          test -x /usr/bin/perl.exe
          msys_perl=$(cygpath -m /usr/bin/perl.exe)
          # Match Git to Perl's logical filename and symlink semantics.
          test -x /usr/bin/git.exe
          msys_git=$(cygpath -m /usr/bin/git.exe)
          command -v git
          git --version
          cmake -S build -B build-output -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DI2PD_BUILD_TUI=ON -DI2PD_TUI_REQUIRED=ON -DWITH_HARDENING=ON \
            -DI2PD_REQUIRE_PERL=ON -DPERL_EXECUTABLE="$msys_perl" \
            -DGIT_EXECUTABLE="$msys_git"
          cmake --build build-output --parallel 2
      # Cheap and bounded, and intentionally before CTest: the PE subsystem
      # and the import table separate a loader-level block (a missing DLL can
      # only show an invisible error dialog for a GUI-subsystem image) from a
      # router start (the informational flag was never seen). The probe
      # reuses the bounded driver, so a hang costs its budget and still
      # prints the captured output.
      - name: Diagnose the informational startup path
        run: |  # zizmor: ignore[misfeature] required by the MSYS2 Clang64 toolchain supplied by setup-msys2
          # Capture the package inventory before any CTest step: a failing
          # suite must still arrive with the exact dependency set that ran.
          pacman -Q > build-output/msys2-packages.txt
          echo "== PE subsystem =="
          objdump -p build-output/i2pd.exe > build-output/router-pe.txt || echo "objdump unavailable"
          grep -i 'Subsystem' build-output/router-pe.txt || echo "subsystem unavailable"
          echo "== imported DLLs =="
          grep -i 'DLL Name' build-output/router-pe.txt || echo "import table unavailable"
          echo "== runtime resolution =="
          ldd build-output/i2pd.exe > build-output/router-dlls.txt || echo "ldd unavailable"
          cat build-output/router-dlls.txt
          # Retain the exact image and resolved toolchain DLLs; the TUI
          # does not link router libraries and is not an equivalent image.
          mkdir -p build-output/startup-images
          cp -p build-output/i2pd.exe build-output/startup-images/
          awk '$2 == "=>" && $3 ~ /^\/clang64\/bin\// { print $3 }' \
            build-output/router-dlls.txt | sort -u > build-output/router-dll-paths.txt
          while IFS= read -r library; do
            cp -p "$library" build-output/startup-images/
          done < build-output/router-dll-paths.txt
          echo "== TUI console control (different library closure) =="
          if timeout 15 ./build-output/i2pd-tui.exe --version; then
            echo "i2pd-tui exit: 0"
          else
            echo "i2pd-tui exit: $?"
          fi
          echo "== bounded --version/--help probe =="
          # A workspace-relative path avoids depending on MSYS2 argument
          # conversion for an absolute POSIX path handed to a native CMake.
          cmake -DBINARY=build-output/i2pd.exe \
            -DVERSION_TIMEOUT=10 -DHELP_TIMEOUT=10 \
            -P tests/check-binary-version.cmake || echo "probe exit: $?"
      - name: Run CTest
        run: |  # zizmor: ignore[misfeature] required by the MSYS2 Clang64 toolchain supplied by setup-msys2
          ctest --test-dir build-output -j 2 --output-on-failure \
            --no-tests=error --output-junit "$PWD/ctest-msys2.xml"
          # Bound the console-image probe: an informational flag that
          # blocks must fail with its own status inside the step budget
          # instead of cancelling the whole job at timeout-minutes.
          timeout 30 ./build-output/i2pd-tui.exe --version
      - name: Upload Windows MSYS2 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-msys2-ctest
          path: |
            build-output/Testing
            ctest-msys2.xml
            build-output/msys2-packages.txt
            build-output/CMakeCache.txt
            build-output/router-pe.txt
            build-output/router-dlls.txt
            build-output/router-dll-paths.txt
            build-output/startup-images
          if-no-files-found: warn
          retention-days: 7

  # Native MSVC uses the runner's vcpkg for third-party dependencies. It
  # builds the default feature set, including torrents, while the
  # reduced TUI/API configuration remains available explicitly through
  # -DWITH_TORRENTS=OFF. No runtime download is part of the product
  # build.
  build-msvc:
    name: Windows MSVC build and tests
    # windows-latest moved past the VS 2022 image used by the project's
    # documented MSVC generator. Pin the image that provides it.
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Locate vcpkg
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            $vcpkgRoot = 'C:\vcpkg'
          }
          if (-not (Test-Path (Join-Path $vcpkgRoot 'vcpkg.exe'))) {
            throw "vcpkg not found under $vcpkgRoot"
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install build dependencies
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            boost-algorithm:x64-windows `
            boost-asio:x64-windows `
            boost-beast:x64-windows `
            boost-dynamic-bitset:x64-windows `
            boost-json:x64-windows `
            boost-logic:x64-windows `
            boost-program-options:x64-windows `
            boost-property-tree:x64-windows `
            boost-smart-ptr:x64-windows `
            boost-static-assert:x64-windows `
            boost-url:x64-windows `
            openssl:x64-windows `
            zlib:x64-windows `
            --clean-after-build
      - name: Configure MSVC
        run: |
          cmake -S build -B build-msvc -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=ProgramDatabase `
            '-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG:FULL /INCREMENTAL:NO /OPT:REF /OPT:ICF' `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            -DI2PD_BUILD_TOOLS=OFF `
            -DI2PD_TUI_REQUIRED=ON `
            -DWITH_HARDENING=ON `
            -DWITH_UPNP=OFF
      - name: Build MSVC TUI and tests
        run: |
          cmake --build build-msvc --config Release --parallel 2 `
            --target i2pd i2pd-tui test-tui-protocol test-tui-terminal `
              test-tui-pipe-name test-tui-win32-pipe test-privsep-windows-ipc `
              test-privsep-windows-isolation test-privsep-windows-supervisor `
              test-win32-shutdown-deadline test-profile-static-lifetime test-release-assertions `
              test-atomic-shared-ptr test-kad-dht `
              test-i2p-service-readiness test-tunnel-destination-cache test-destination-leaseset-session test-deadline-mutex test-child-stop-budget
      - name: Run TUI and worker IPC tests
        run: |
          ctest --test-dir build-msvc -C Release -j 2 --output-on-failure `
            -R '^(test-(tui-protocol|tui-terminal|tui-pipe-name|tui-win32-pipe|privsep-windows-(ipc|isolation|supervisor)|win32-shutdown-deadline|profile-static-lifetime|i2p-service-readiness|tunnel-destination-cache|destination-leaseset-session|deadline-mutex|child-stop-budget|atomic-shared-ptr|kad-dht|release-assertions))$' `
            --no-tests=error --output-junit "$PWD/ctest-msvc.xml"
      - name: Verify runtime install
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'openi2pd-install'
          cmake --install build-msvc --config Release --prefix $prefix
          if (-not (Test-Path (Join-Path $prefix 'bin\i2pd-tui.exe'))) {
            throw 'i2pd-tui.exe was not installed'
          }
      - name: Diagnose MSVC heap failures
        if: ${{ always() && inputs.heap_diagnostics }}
        timeout-minutes: 8
        run: |
          # Use installed SDK tools only. Missing tools are diagnostic
          # infrastructure failures, not evidence that the tests are clean.
          $debugTools = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64'
          $cdb = Join-Path $debugTools 'cdb.exe'
          $gflags = Join-Path $debugTools 'gflags.exe'
          if (-not (Test-Path $cdb) -or -not (Test-Path $gflags)) {
            throw 'heap_diagnostics requires installed x64 CDB and GFlags'
          }
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'build-msvc/heap-diagnostics'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $commands = Join-Path $evidence 'exceptions.txt'
          # Print only code locations and function names: no dumps,
          # memory reads, argument values, locals or register dumps.
          @'
          sxe -c ".echo OPENI2PD_CRASH; .lastevent; ln @rip; kc 40; q" av
          sxe -c ".echo OPENI2PD_CRASH; .lastevent; ln @rip; kc 40; q" 0xc0000374
          sxe -c ".echo OPENI2PD_CRASH; .lastevent; ln @rip; kc 40; q" 0xc0000409
          sxe -c ".echo OPENI2PD_CRASH; .lastevent; ln @rip; kc 40; q" 0xc0000142
          g
          '@ | Set-Content -Encoding ascii $commands
          $failures = @()
          foreach ($test in @('test-tui-protocol', 'test-tui-pipe-name', 'test-privsep-windows-isolation', 'test-profile-static-lifetime', 'test-atomic-shared-ptr', 'test-kad-dht', 'test-i2p-service-readiness', 'test-tunnel-destination-cache', 'test-destination-leaseset-session', 'test-deadline-mutex', 'test-child-stop-budget', 'test-privsep-windows-supervisor')) {
            $image = "$test.exe"
            $binary = Join-Path $env:GITHUB_WORKSPACE "build-msvc/tests/Release/$image"
            if (-not (Test-Path $binary)) { throw "missing diagnostic target $image" }
            try {
              & $gflags /p /enable $image /full
              if ($LASTEXITCODE -ne 0) { throw "PageHeap enable failed for $image" }
              $log = Join-Path $evidence "$test.txt"
              $symbols = Split-Path -Parent $binary
              # Trace the parent only: worker command lines hold secrets.
              # Child initializer stacks require a nonsecret probe.
              $debugArguments = @('-G', '-noshell', '-lines', '-y', "`"$symbols`"", '-logo', "`"$log`"", '-cf', "`"$commands`"", "`"$binary`"")
              $debugger = Start-Process -FilePath $cdb -ArgumentList $debugArguments -NoNewWindow -PassThru
              if (-not $debugger.WaitForExit(120000)) {
                & taskkill.exe /PID $debugger.Id /T /F
                if ($LASTEXITCODE -ne 0) { throw "debugger process cleanup failed for $image" }
                $failures += "$test debugger deadline"
              } elseif ($debugger.ExitCode -ne 0) {
                $failures += "$test debugger exit $($debugger.ExitCode)"
              }
              # CDB q takes no exit code. Its logged exception marker
              # is a failure even when the debugger itself exits zero.
              if (-not (Test-Path $log)) {
                $failures += "$test missing debugger log"
              } elseif (Select-String -Path $log -Pattern '^OPENI2PD_CRASH\s*$' -Quiet) {
                $failures += "$test debugger exception"
              }
            } finally {
              & $gflags /p /disable $image
              if ($LASTEXITCODE -ne 0) { throw "PageHeap cleanup failed for $image" }
            }
          }
          if ($failures.Count) { throw ($failures -join '; ') }
      - name: Upload Windows MSVC evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-msvc-ctest
          path: |
            build-msvc/Testing
            ctest-msvc.xml
            build-msvc/heap-diagnostics
            build-msvc/tests/Release/*.pdb
            build-msvc/tests/Release/test-tui-protocol.exe
            build-msvc/tests/Release/test-tui-pipe-name.exe
            build-msvc/tests/Release/test-privsep-windows-isolation.exe
            build-msvc/tests/Release/test-profile-static-lifetime.exe
            build-msvc/tests/Release/test-atomic-shared-ptr.exe
            build-msvc/tests/Release/test-kad-dht.exe
            build-msvc/tests/Release/test-i2p-service-readiness.exe
            build-msvc/tests/Release/test-deadline-mutex.exe
            build-msvc/tests/Release/test-child-stop-budget.exe
            build-msvc/tests/Release/test-tunnel-destination-cache.exe
            build-msvc/tests/Release/test-destination-leaseset-session.exe
            build-msvc/tests/Release/test-privsep-windows-supervisor.exe
          if-no-files-found: warn
          retention-days: 7
