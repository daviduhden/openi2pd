---
name: Linux and Android

# Automatic runs are intentionally suspended during the refactoring. Only a
# maintainer may start this workflow manually from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build libboost-dev libboost-atomic-dev libboost-filesystem-dev libboost-program-options-dev libboost-json-dev libboost-url-dev libssl-dev zlib1g-dev libminiupnpc-dev
      - name: Build and run basic tests
        run: |
          cmake -S build -B build-output -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-output --parallel 2
          ctest --test-dir build-output --output-on-failure --timeout 60
          ./build-output/i2pd --version
      - name: Validate Perl i2pdctl
        run: |
          perl -c tools/scripts/i2pdctl
          perl tools/scripts/validate-branding.pl
          prove -v tools/tests/i2pdctl.t

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up OpenJDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate Android Gradle toolchain
        run: |
          cd android
          ./gradlew --version --no-daemon
      - name: Checkout vcpkg
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          repository: microsoft/vcpkg
          ref: bf19794383e8fb95eba5aa553235bc8ec2271688
          path: .ci-vcpkg
      - name: Prepare Android toolchain
        run: |
          test -d "$ANDROID_NDK_HOME"
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/.ci-vcpkg" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$(basename "$ANDROID_NDK_HOME")" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          .ci-vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Cache Android dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: android-arm64-${{ env.NDK_VERSION }}-${{ hashFiles('contrib/ci/android/*') }}
      - name: Build Android arm64
        run: |
          cmake -S build -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/contrib/ci/android" \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/contrib/ci/android" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-android --parallel 2 --target i2pd
          file build-android/i2pd | grep 'ARM aarch64'
