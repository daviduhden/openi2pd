# and license details.
#
# openi2pd: build.
#
# Configures build and manual CI integration.
#

---
name: Linux and Android

# All runs are manual. Do not add push, pull_request, schedule or workflow_call
# triggers: this repository validates every revision only when a maintainer
# explicitly dispatches the workflow.
on:
  workflow_dispatch:
    inputs:
      android_ui:
        description: 'Run the API 29 emulator UI/accessibility lane (x86_64)'
        type: boolean
        default: false
      perl_style:
        description: 'Run the Perl::Critic and Test::More quality lane'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  skills-static:
    name: Agent Skills static contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Validate Agent Skills without compiling
        run: cmake -DPROJECT_ROOT="$PWD" -P tests/check-agent-skills.cmake
      - name: Validate modern-language policy without compiling
        run: cmake -DPROJECT_ROOT="$PWD" -P tests/check-language-modernization.cmake
      - name: Validate translation catalogs without compiling
        run: cmake -DPROJECT_ROOT="$PWD" -P tests/check-i18n.cmake
      - name: Validate tool inventory without compiling
        run: cmake -DPROJECT_ROOT="$PWD" -P tests/check-tools-inventory.cmake
      - name: Validate legal metadata without compiling
        run: cmake -DPROJECT_ROOT="$PWD" -P tests/check-legal-metadata.cmake
      - name: Validate upstream pins without compiling
        run: cmake -DPROJECT_ROOT="$PWD" -P tests/check-upstream-pins.cmake
      - name: Validate service definitions without compiling
        run: |
          cmake -DPROJECT_ROOT="$PWD" -P tests/check-services.cmake
          cmake -DPROJECT_ROOT="$PWD" -P tests/check-build-system.cmake
      - name: Validate manual workflow contracts without compiling
        run: perl tools/scripts/check-workflows.pl

  perl-quality:
    name: Perl quality (Test::More and Perl::Critic)
    # Opt-in at dispatch time. libperl-critic-perl is a distribution package,
    # not a CPAN download; the job never runs for a normal dispatch.
    if: ${{ inputs.perl_style == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Install distribution Perl tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            perl libperl-critic-perl
          perl --version | head -2
          perlcritic --version
      - name: Compile maintained Perl
        run: |
          for file in $(git ls-files '*.pl' '*.t' 'tools/scripts/i2pdctl'); do
            perl -c "$file"
          done
      - name: Run Test::More suites
        run: prove -v tools/tests/i2pdctl.t tools/tests/validate-branding.t tools/tests/perl-portability.t tools/tests/maintenance-checkers.t
      - name: Run Perl::Critic
        run: |
          mapfile -t perl_files < <(git ls-files '*.pl' '*.t' 'tools/scripts/i2pdctl')
          perlcritic --profile .perlcriticrc "${perl_files[@]}"


  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang
            cc: clang
            cxx: clang++
          - name: gcc
            cc: gcc
            cxx: g++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Install latest build tools from Homebrew
        timeout-minutes: 20
        uses: ./.github/actions/brew-toolchain
      - name: Build and run all CTest targets
        run: |
          cmake -S build -B build-output -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DI2PD_REQUIRE_PERL=ON \
            -DI2PD_BUILD_TUI=ON -DI2PD_OPENSSL_EXPECT=OpenSSL
          cmake --build build-output --parallel 2
          ctest --test-dir build-output -j 2 --output-on-failure \
            --no-tests=error --output-junit "$PWD/ctest-${{ matrix.name }}.xml"
          ./build-output/i2pd --version
      - name: Run I2PSnark compatibility regressions
        run: |
          ctest --test-dir build-output -j 2 --output-on-failure --no-tests=error \
            --output-junit "$PWD/ctest-torrents.xml" \
            -R '^test-(torrents-(magnet|engine-interop|dht-interop|dht-protocol|pex|comments|creator|state|priorities)|torrent-payload-storage)$'
      - name: Run client parsing and persistence regressions
        run: |
          ctest --test-dir build-output -j 2 --output-on-failure --no-tests=error \
            --output-junit "$PWD/ctest-client.xml" \
            -R '^test-(i2ptunnel-http|addressbook-case|torrents-security)$'
      - name: Run profile, Android lifecycle and firewall regressions
        # The native Android seam runs on the host; JNI/device evidence is separate.
        run: |
          ctest --test-dir build-output -j 2 --output-on-failure --no-tests=error \
            --output-junit "$PWD/ctest-profile.xml" \
            -R '^(test-(datagram-receiver-lifecycle|netdb-stop-admission|tunnels-restart|router-profile-(race|storage)|daemon-init-rollback|android-daemon-lifecycle|routerinfo-firewall)|tools-smoke)$'
      - name: Verify CTest subsystem labels
        run: |
          for label in i2p security memory ipc tui torrent tools perl docs interop platform android ci static packaging services unit install smoke cli integration; do
            ctest --test-dir build-output -N -L "$label" --no-tests=error
          done
      - name: Validate Perl and static interoperability fixtures
        run: |
          perl -c tools/scripts/i2pdctl
          perl -c tools/scripts/validate-branding.pl
          perl -c tools/scripts/check-doc-links.pl
          perl -c tools/scripts/check-doc-nav.pl
          perl -c tests/interop/check-vectors.pl
          perl -c android/tools/check-android-locales.pl
          perl -c android/tools/check-android-jni-symbols.pl
          perl -c i18n/check-i18n-catalogs.pl
          perl tools/scripts/validate-branding.pl
          perl tools/scripts/check-doc-links.pl docs
          perl tools/scripts/check-doc-nav.pl .
          perl tests/interop/check-vectors.pl
          if command -v prove >/dev/null 2>&1; then
            prove -v tools/tests/i2pdctl.t
            prove -v tools/tests/validate-branding.t
            prove -v tools/tests/perl-portability.t
            prove -v tools/tests/maintenance-checkers.t
          else
            perl tools/tests/i2pdctl.t
            perl tools/tests/validate-branding.t
            perl tools/tests/perl-portability.t
            perl tools/tests/maintenance-checkers.t
          fi
      - name: Upload Linux CTest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: linux-${{ matrix.name }}-ctest
          path: |
            build-output/Testing
            ctest-*.xml
          if-no-files-found: warn
          retention-days: 7

  linux-openssl-3:
    name: Linux OpenSSL 3.x
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Install distribution toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libssl-dev zlib1g-dev libncurses-dev \
            libminiupnpc-dev libboost-dev libboost-program-options-dev \
            libboost-json-dev libboost-url-dev pkg-config perl
      - name: Build and run all CTest targets with OpenSSL 3.x
        run: |
          cmake -S build -B build-openssl3 -G Ninja \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DI2PD_REQUIRE_PERL=ON \
            -DI2PD_BUILD_TUI=ON -DI2PD_OPENSSL_EXPECT=OpenSSL
          cmake --build build-openssl3 --parallel 2
          ctest --test-dir build-openssl3 -j 2 --output-on-failure \
            --no-tests=error --output-junit "$PWD/ctest-openssl3.xml"
          ./build-openssl3/i2pd --version
      - name: Upload OpenSSL 3 CTest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: linux-openssl-3-ctest
          path: |
            build-openssl3/Testing
            ctest-openssl3.xml
          if-no-files-found: warn
          retention-days: 7

  openssl-pinned:
    name: Linux OpenSSL ${{ matrix.openssl }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - openssl: '4.0.0'
            sha256: c32cf49a959c4f345f9606982dd36e7d28f7c58b19c2e25d75624d2b3d2f79ac
          - openssl: '4.0.3'
            sha256: 325b5c806167c13b40b1ffeadfe0248197c00eccc4cf123ec1e28d2d2fd216d9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Install latest build tools from Homebrew
        timeout-minutes: 20
        uses: ./.github/actions/brew-toolchain
      - name: Build pinned OpenSSL (manual CI only)
        env:
          OPENSSL_PIN: ${{ matrix.openssl }}
          OPENSSL_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          archive="openssl-${OPENSSL_PIN}.tar.gz"
          curl -fsSLO "https://www.openssl.org/source/${archive}"
          printf '%s  %s\n' "$OPENSSL_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive"
          prefix="$RUNNER_TEMP/openssl-${OPENSSL_PIN}"
          cd "openssl-${OPENSSL_PIN}"
          ./Configure --prefix="$prefix" --libdir=lib no-tests no-docs shared
          make -j2
          make install_sw
          {
            echo "OPENSSL_ROOT_DIR=$prefix"
            echo "CMAKE_PREFIX_PATH=$prefix:${CMAKE_PREFIX_PATH:-}"
            echo "LD_LIBRARY_PATH=$prefix/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
      - name: Build and run all CTest targets with pinned OpenSSL
        run: |
          cmake -S build -B build-pinned -G Ninja \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DI2PD_REQUIRE_PERL=ON \
            -DI2PD_BUILD_TUI=ON -DI2PD_OPENSSL_EXPECT=OpenSSL \
            -DI2PD_OPENSSL_EXPECT_VERSION=${{ matrix.openssl }}
          cmake --build build-pinned --parallel 2
          ctest --test-dir build-pinned -j 2 --output-on-failure \
            --no-tests=error --output-junit "$PWD/ctest-pinned-${{ matrix.openssl }}.xml"
          ./build-pinned/i2pd --version
      - name: Upload pinned OpenSSL CTest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: linux-openssl-${{ matrix.openssl }}-ctest
          path: |
            build-pinned/Testing
            ctest-pinned-${{ matrix.openssl }}.xml
          if-no-files-found: warn
          retention-days: 7

  install-components:
    name: Install components and consumer package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Install latest build tools from Homebrew
        timeout-minutes: 20
        uses: ./.github/actions/brew-toolchain
      - name: Build, install components and consume package
        run: |
          set -euo pipefail
          cmake -S build -B build-install -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DWITH_LIBRARY=ON -DWITH_BINARY=ON \
            -DI2PD_BUILD_TUI=ON -DI2PD_BUILD_TOOLS=ON \
            -DI2PD_SERVICE_MANAGER=systemd \
            -DI2PD_OPENSSL_EXPECT=OpenSSL
          cmake --build build-install --parallel 2
          prefix="$RUNNER_TEMP/openi2pd-install"
          for component in Runtime Tui Libraries Development Tools Documentation Service; do
            cmake --install build-install --prefix "$prefix" --component "$component"
          done
          test -f "$prefix/lib/systemd/system/i2pd.service"
          test -f "$prefix/lib/sysusers.d/openi2pd.conf"
          test -f "$prefix/lib/tmpfiles.d/openi2pd.conf"
          test -f "$prefix/include/privsep/Protocol.h"
          # Exercise DESTDIR independently of the configured prefix.
          dest="$RUNNER_TEMP/openi2pd-dest"
          DESTDIR="$dest" cmake --install build-install --prefix /usr --component Runtime >/dev/null
          test -x "$dest/usr/bin/i2pd"
          test -x "$prefix/bin/i2pd"
          test -x "$prefix/bin/i2pd-tui"
          test -f "$prefix/include/libi2pd/Log.h"
          test -f "$prefix/lib/cmake/i2pd/i2pdConfig.cmake"
          test -f "$prefix/etc/i2pd/i2pd.conf"
          test -f "$prefix/share/i2pd/certificates/reseed/acetone_at_mail.i2p.crt"
          test -f "$prefix/share/i2pd/certificates/family/i2p-dev.crt"
          test -f "$prefix/share/doc/i2pd/LICENSE"
          test -f "$prefix/share/doc/i2pd/NOTICE"
          test -f "$prefix/share/doc/i2pd/ChangeLog"
          test -f "$prefix/share/doc/i2pd/README.md"
          test -f "$prefix/share/doc/i2pd/LICENSE.i2pd-tools"
          test -f "$prefix/share/doc/i2pd/CC-BY-SA-4.0"
          test -f "$prefix/share/doc/i2pd/docs/LICENSE.i2pd-docs-en"
          test -f "$prefix/share/doc/i2pd/docs/i18n.md"
          test -f "$prefix/share/doc/i2pd/assets/branding/colors.md"
          test -f "$prefix/share/man/man1/i2pd.1"
          test -f "$prefix/share/man/man1/i2pd-tui.1"
          test -f "$prefix/share/man/man1/i2pdctl.1"
          test -x "$prefix/bin/i2pdctl"
          perl -c "$prefix/bin/i2pdctl"
          test -f "$prefix/share/doc/i2pd/LICENSE.i2pd-tools"
          test -f "$prefix/share/applications/openi2pd.desktop"
          grep -q '^Exec=i2pd-tui$' "$prefix/share/applications/openi2pd.desktop"
          test -f "$prefix/share/icons/hicolor/scalable/apps/openi2pd.svg"
          test -f "$prefix/share/icons/hicolor/256x256/apps/openi2pd.png"
          for tool in autoconf_i2pd b33address b33offlinekeys famtool i2pbase64 keygen keyinfo offlinekeys regaddr regaddr_3ld regaddralias routerinfo vain verifyhost x25519; do
            test -x "$prefix/bin/$tool"
          done
          consumer="$RUNNER_TEMP/openi2pd-consumer"
          mkdir -p "$consumer"
          cat > "$consumer/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(openi2pd_consumer CXX)
          set(CMAKE_CXX_STANDARD 23)
          find_package(i2pd CONFIG REQUIRED COMPONENTS Libraries Development)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE i2pd::libi2pdclient)
          EOF
          cat > "$consumer/main.cpp" <<'EOF'
          #include <boost/json.hpp>
          #include <boost/url.hpp>
          int main() {
            const auto value = boost::json::parse("{}");
            const auto url = boost::urls::parse_uri("http://tracker.i2p/announce");
            return value.is_object() && url ? 0 : 1;
          }
          EOF
          cmake -S "$consumer" -B "$consumer/build" -G Ninja \
            -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$consumer/build" --parallel 2
          "$consumer/build/consumer"
      - name: Stage installed component tree
        if: always()
        run: |
          rm -rf install-output
          cp -a "$RUNNER_TEMP/openi2pd-install" install-output 2>/dev/null || true
          find install-output -maxdepth 3 -type f | sort | sed -n '1,120p'
      - name: Upload installed component tree
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: install-components
          path: install-output
          if-no-files-found: warn
          retention-days: 7

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      I2PD_ANDROID_CMAKE_ARGS: >-
        -DWITH_HARDENING=ON
        -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android
        -DBOOST_ROOT=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android
        -DBOOST_INCLUDEDIR=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android/include
        -DBOOST_LIBRARYDIR=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android/lib
        -DBoost_INCLUDE_DIR=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android/include
        -DBoost_LIBRARY_DIR_RELEASE=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android/lib
        -DBoost_LIBRARY_DIR_DEBUG=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android/lib
        -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH
        -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH
        -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up OpenJDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache Gradle distributions and dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', 'android/gradle.properties') }}
      - name: Validate Android Gradle toolchain
        run: |
          sh android/tools/java25-probe/check-config.sh
          perl android/tools/check-android-locales.pl
          cd android
          ./gradlew --version --no-daemon
      - name: Install Android platform used by the app
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set" >&2
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"
          # `yes` receives SIGPIPE when sdkmanager closes stdin; disable
          # pipefail only for this pipeline so the sdkmanager status stays
          # authoritative instead of masking a real license failure.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          # AGP may resolve compileSdk 37 to android-37 or the minor-versioned
          # android-37.0 package. Accept either installed directory and export
          # the resolved android.jar for the D8/R8 probe.
          PLATFORM_DIR=$(find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-37*' | sort | head -1)
          test -n "$PLATFORM_DIR"
          test -f "$PLATFORM_DIR/android.jar"
          echo "ANDROID_JAR=$PLATFORM_DIR/android.jar" >> "$GITHUB_ENV"
          ls -1 "$ANDROID_HOME/platforms"
      - name: Checkout vcpkg
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          repository: microsoft/vcpkg
          ref: bf19794383e8fb95eba5aa553235bc8ec2271688
          path: .ci-vcpkg
      - name: Prepare Android toolchain
        run: |
          test -d "$ANDROID_NDK_HOME"
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/.ci-vcpkg" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$(basename "$ANDROID_NDK_HOME")" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          .ci-vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Cache Android dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: android-arm64-android-29-${{ env.NDK_VERSION }}-${{ hashFiles('contrib/ci/android/*') }}
      - name: Build Android arm64
        run: |
          cmake -S build -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/contrib/ci/android" \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/contrib/ci/android" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DI2PD_BUILD_JNI=ON -DWITH_BINARY=OFF -DWITH_HARDENING=ON \
            -DI2PD_OPENSSL_EXPECT=OpenSSL
          cmake --build build-android --parallel 2 --target i2pd_jni
          file build-android/libi2pd.so | grep 'ARM aarch64'
      - name: Android unit tests and Lint
        run: |
          cd android
          ./gradlew :i2pd:testDebugUnitTest :i2pd:lintDebug --no-daemon \
            -Pi2pd.ndkVersion="$NDK_VERSION" \
            -Pi2pd.abis=arm64-v8a \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pi2pd.cmakeArgs="$I2PD_ANDROID_CMAKE_ARGS"
      - name: Assert Android JVM tests actually ran
        run: |
          test -n "$(find android/app/build/test-results/testDebugUnitTest -name '*.xml' -print -quit)"
          ! grep -R -E '<(failure|error)' android/app/build/test-results/testDebugUnitTest
      - name: Assert Java 25 class-file output
        run: |
          class_file=$(find android/app/build/intermediates/javac/debug -name RouterService.class -print -quit)
          test -n "$class_file"
          javap_out=$(mktemp)
          javap -verbose "$class_file" > "$javap_out"
          grep -q 'major version: 69' "$javap_out" \
            || { echo "RouterService.class is not class-file major 69" >&2; exit 1; }
          rm -f "$javap_out"
      - name: Probe Java 25 D8/R8 dexing
        run: |
          R8_JAR=$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.android.tools" \
            -path '*/r8/*' -name 'r8-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
          if [ -z "$R8_JAR" ]; then
            echo "AGP-resolved R8 jar not found in the Gradle cache" >&2
            exit 1
          fi
          test -f "$ANDROID_JAR"
          ANDROID_JAR="$ANDROID_JAR" R8_JAR="$R8_JAR" \
            sh android/tools/java25-probe/verify-java25.sh
      - name: Show Android lint report on failure
        if: failure()
        run: |
          for report in android/app/build/reports/lint-results-debug.txt android/app/build/reports/lint-results-release.txt; do
            if [ -f "$report" ]; then cat "$report"; fi
          done
      - name: Build debug APK for arm64
        run: |
          cd android
          ./gradlew :i2pd:assembleDebug :i2pd:assembleDebugAndroidTest \
            :i2pd:assembleRelease :i2pd:lintRelease --no-daemon \
            -Pi2pd.ndkVersion="$NDK_VERSION" \
            -Pi2pd.abis=arm64-v8a \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pi2pd.cmakeArgs="$I2PD_ANDROID_CMAKE_ARGS"
          apk=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$apk"
          listing=$(unzip -l "$apk")
          printf '%s\n' "$listing" | grep -q 'lib/arm64-v8a/libi2pd.so' \
            || { echo "debug APK does not package lib/arm64-v8a/libi2pd.so" >&2; exit 1; }
          printf '%s\n' "$listing" | grep -q 'lib/arm64-v8a/libc++_shared.so' \
            || { echo "debug APK does not package libc++_shared.so" >&2; exit 1; }
          printf '%s\n' "$listing" | grep -q 'assets/i2pd.conf' \
            || { echo "debug APK does not package the bundled i2pd.conf" >&2; exit 1; }
          expected_certs=$(find ../contrib/certificates -type f -name '*.crt' | wc -l | tr -d ' ')
          actual_certs=$(printf '%s\n' "$listing" | grep -cE 'assets/certificates/.*\.crt$' || true)
          test "$actual_certs" -eq "$expected_certs" \
            || { echo "APK has $actual_certs certificates, expected $expected_certs" >&2; exit 1; }
          unzip -p "$apk" classes.dex | od -An -t x1 -N4 | grep -q '64 65 78 0a' \
            || { echo "debug APK classes.dex has no dex magic" >&2; exit 1; }
          native=$(mktemp)
          unzip -p "$apk" lib/arm64-v8a/libi2pd.so > "$native"
          file "$native" | grep -q 'ARM aarch64' \
            || { echo "packaged libi2pd.so is not aarch64" >&2; exit 1; }
          nm -D --defined-only "$native" | grep -q 'Java_org_openi2pd_router_I2PD' \
            || { echo "packaged libi2pd.so exports no JNI entry points" >&2; exit 1; }
          rm -f "$native"
          test -n "$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
      - name: Check Android JNI declarations
        run: perl android/tools/check-android-jni-symbols.pl
      - name: Verify Java 25 dex lowering
        run: |
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$apk" || { echo "debug APK missing" >&2; exit 1; }
          dex=$(mktemp)
          unzip -p "$apk" classes.dex > "$dex"
          version=$(od -An -t u1 -j4 -N3 "$dex" | tr -d ' \n')
          test "$version" = "485157" \
            || { echo "APK classes.dex is not DEX 039 (got $version)" >&2; exit 1; }
          # D8 must remove the record superclass, record ObjectMethods
          # bootstrap and the sealed type-switch/MatchException references at
          # minSdk 29. A surviving reference would fail on ART 10.
          strings_out=$(mktemp)
          strings "$dex" > "$strings_out"
          if grep -Eq 'java/lang/Record|ObjectMethods|SwitchBootstraps|MatchException' "$strings_out"; then
            echo "DEX still contains a Java 25 bootstrap unavailable on ART 29" >&2
            rm -f "$strings_out" "$dex"
            exit 1
          fi
          rm -f "$strings_out" "$dex"
      - name: Upload Android reports and APKs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: android-arm64-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
            android/app/build/outputs/apk
          if-no-files-found: warn
          retention-days: 7

  android-ui:
    name: Android API 29 UI and accessibility
    # Opt-in at dispatch time. This lane needs an x86_64 native build plus an
    # API 29 system image, so a normal Android dispatch stays arm64-only. It
    # exercises the prepared Espresso/contract tests on a real ART image; it
    # is not evidence for the arm64 device matrix.
    if: ${{ inputs.android_ui == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      I2PD_ANDROID_CMAKE_ARGS: >-
        -DWITH_HARDENING=ON
        -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x86_64-android
        -DBOOST_ROOT=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x86_64-android
        -DBOOST_INCLUDEDIR=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x86_64-android/include
        -DBOOST_LIBRARYDIR=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x86_64-android/lib
        -DBoost_INCLUDE_DIR=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x86_64-android/include
        -DBoost_LIBRARY_DIR_RELEASE=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x86_64-android/lib
        -DBoost_LIBRARY_DIR_DEBUG=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x86_64-android/lib
        -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH
        -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH
        -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up OpenJDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache Gradle distributions and dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-ui-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', 'android/gradle.properties') }}
      - name: Validate Android Gradle toolchain
        run: |
          sh android/tools/java25-probe/check-config.sh
          perl android/tools/check-android-locales.pl
          perl android/tools/check-android-jni-symbols.pl
          cd android
          ./gradlew --version --no-daemon
      - name: Install SDK, emulator and API 29 image
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set" >&2
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;30.0.16248370" \
            "emulator" \
            "system-images;android-29;google_apis;x86_64" \
            "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/platform-tools/adb"
      - name: Checkout vcpkg
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          repository: microsoft/vcpkg
          ref: bf19794383e8fb95eba5aa553235bc8ec2271688
          path: .ci-vcpkg
      - name: Prepare Android toolchain
        run: |
          test -d "$ANDROID_NDK_HOME"
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/.ci-vcpkg" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$(basename "$ANDROID_NDK_HOME")" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          .ci-vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Cache Android x86_64 dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: android-x86_64-android-29-${{ env.NDK_VERSION }}-${{ hashFiles('contrib/ci/android/*') }}
      - name: Build Android x86_64
        run: |
          cmake -S build -B build-android-x86_64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/contrib/ci/android" \
            -DVCPKG_TARGET_TRIPLET=x86_64-android \
            -DVCPKG_CMAKE_SYSTEM_VERSION=29 \
            -DVCPKG_BUILD_TYPE=release \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DI2PD_BUILD_JNI=ON -DWITH_BINARY=OFF -DWITH_HARDENING=ON \
            -DI2PD_OPENSSL_EXPECT=OpenSSL
          cmake --build build-android-x86_64 --parallel 2 --target i2pd_jni
          file build-android-x86_64/libi2pd.so | grep 'x86-64'
      - name: Boot API 29 emulator
        run: |
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if [ ! -x "$AVDMANAGER" ]; then
            AVDMANAGER="$(command -v avdmanager)"
          fi
          test -x "$AVDMANAGER"
          echo "no" | "$AVDMANAGER" create avd --force --name openi2pd-api29 \
            --package "system-images;android-29;google_apis;x86_64" --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd openi2pd-api29 -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          timeout 180 "$ADB" wait-for-device
          timeout 420 bash -c "until [ \"\$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')\" = 1 ]; do sleep 3; done" \
            || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          "$ADB" shell input keyevent 82
          "$ADB" shell getprop ro.build.version.sdk
      - name: Run UI and accessibility instrumentation tests
        run: |
          cd android
          ./gradlew :i2pd:connectedDebugAndroidTest --no-daemon \
            -Pi2pd.ndkVersion="$NDK_VERSION" \
            -Pi2pd.abis=x86_64 \
            -Pandroid.injected.build.abi=x86_64 \
            -Pi2pd.cmakeArgs="$I2PD_ANDROID_CMAKE_ARGS"
          results=app/build/outputs/androidTest-results/connected
          test -n "$(find "$results" -name '*.xml' -print -quit)" \
            || { echo "connectedDebugAndroidTest produced no XML report" >&2; exit 1; }
          ! grep -R -E '<(failure|error)' "$results"
      - name: Collect emulator diagnostics on failure
        if: failure()
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" logcat -d -v threadtime > "$RUNNER_TEMP/logcat.txt" || true
          cat "$RUNNER_TEMP/emulator.log" 2>/dev/null || true
      - name: Upload Android UI reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: android-api29-ui-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/androidTest-results
            android/app/build/test-results
          if-no-files-found: warn
          retention-days: 7

  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Install Perl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends perl git
      - name: Clone current I2P Java comparison reference
        run: |
          git -c init.defaultBranch=main init --quiet "$RUNNER_TEMP/i2p-java"
          git -C "$RUNNER_TEMP/i2p-java" remote add origin https://github.com/i2p/i2p.i2p.git
          git -C "$RUNNER_TEMP/i2p-java" fetch --depth 1 origin \
            refs/tags/i2p-2.14.0:refs/tags/i2p-2.14.0
          git -C "$RUNNER_TEMP/i2p-java" checkout --detach refs/tags/i2p-2.14.0
          chmod -R a-w "$RUNNER_TEMP/i2p-java"
      - name: Validate current comparison reference
        env:
          I2P_JAVA_REFERENCE: ${{ runner.temp }}/i2p-java
        run: |
          tests/interop/check-reference.sh
      - name: Clone historical fixture provenance reference
        run: |
          git -c init.defaultBranch=main init --quiet "$RUNNER_TEMP/i2p-java-fixtures"
          git -C "$RUNNER_TEMP/i2p-java-fixtures" remote add origin https://github.com/i2p/i2p.i2p.git
          git -C "$RUNNER_TEMP/i2p-java-fixtures" fetch --depth 1 origin \
            refs/tags/i2p-2.13.0:refs/tags/i2p-2.13.0
          git -C "$RUNNER_TEMP/i2p-java-fixtures" checkout --detach refs/tags/i2p-2.13.0
          chmod -R a-w "$RUNNER_TEMP/i2p-java-fixtures"
      - name: Validate historical interoperability fixtures
        env:
          I2P_JAVA_FIXTURE_REFERENCE: ${{ runner.temp }}/i2p-java-fixtures
        run: |
          perl tests/interop/check-vectors.pl --require-reference

  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            flags: "-DWITH_ADDRSANITIZER=ON -DWITH_UNDEFSANITIZER=ON"
            asan_options: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
            ubsan_options: "halt_on_error=1:print_stacktrace=1"
          - name: ubsan
            flags: "-DWITH_UNDEFSANITIZER=ON"
            asan_options: ""
            ubsan_options: "halt_on_error=1:print_stacktrace=1"
          - name: tsan
            flags: "-DWITH_THREADSANITIZER=ON"
            asan_options: ""
            ubsan_options: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Install latest build tools from Homebrew
        timeout-minutes: 20
        uses: ./.github/actions/brew-toolchain
      - name: Build and run sanitizer CTest matrix
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: |
          cmake -S build -B build-sanitizers -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON -DWITH_UPNP=OFF \
            -DI2PD_REQUIRE_PERL=ON \
            -DI2PD_BUILD_TUI=ON -DI2PD_OPENSSL_EXPECT=OpenSSL \
            ${{ matrix.flags }}
          cmake --build build-sanitizers --parallel 2
          ctest --test-dir build-sanitizers -j 1 --output-on-failure \
            --no-tests=error --output-junit "$PWD/ctest-sanitizers-${{ matrix.name }}.xml"
      - name: Upload sanitizer test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sanitizer-${{ matrix.name }}-logs
          path: |
            build-sanitizers/Testing
            ctest-sanitizers-*.xml
          if-no-files-found: warn
          retention-days: 7
