# See the LICENSE file at the top of the project tree for copyright and
# license details.
#
# openi2pd: validation.
#
# Configures build and manual CI integration.
#

---
name: Validation

# All runs are manual. Do not add push, pull_request, schedule or
# workflow_call triggers: this repository validates every revision only
# when a maintainer explicitly dispatches the workflow.
on:
  workflow_dispatch:
    inputs:
      perl_style:
        description: 'Run the Perl::Critic and Test::More quality lane'
        type: boolean
        default: false
      fuzz_seconds:
        description: "Bounded seconds per target (manual CI only)"
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-docs:
    name: C++ source API documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen ripgrep
      - name: Generate and check C++ API documentation
        run: |
          mkdir -p docs/generated/source-api
          doxygen docs/Doxyfile.source
      - name: Collect source TODO candidates for review
        if: always()
        run: |
          if rg -n '\b(TODO|FIXME|XXX)\b' libi2pd libi2pd_client privsep daemon tui tools android i18n tests/interop contrib debian \
            -g '*.{h,hpp,c,cpp,java,aidl,pl,sh,rc,openrc,scm}' \
            -g '**/run' -g '**/finish' -g '**/i2pd' -g '**/i2pdctl' > source-doc-todos.txt; then
            :
          else
            result=$?
            if [ "$result" -ne 1 ]; then exit "$result"; fi
          fi
      - name: Upload source documentation and TODO candidates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: source-api-docs
          path: |
            docs/generated/source-api
            source-doc-todos.txt
          if-no-files-found: warn
          retention-days: 7

  skills-static:
    name: Agent Skills static contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Agent Skills without compiling
        run: cmake -DPROJECT_ROOT="$PWD" -P tests/check-agent-skills.cmake
      - name: Validate modern-language policy without compiling
        run: cmake -DPROJECT_ROOT="$PWD" -P tests/check-language-modernization.cmake
      - name: Check maintained C++ comment delimiters without compiling
        run: perl tools/tests/cpp-comment-integrity.t
      - name: Validate translation catalogs without compiling
        run: cmake -DPROJECT_ROOT="$PWD" -P tests/check-i18n.cmake
      - name: Validate tool inventory without compiling
        run: cmake -DPROJECT_ROOT="$PWD" -P tests/check-tools-inventory.cmake
      - name: Validate legal metadata without compiling
        run: cmake -DPROJECT_ROOT="$PWD" -P tests/check-legal-metadata.cmake
      - name: Validate upstream pins without compiling
        run: cmake -DPROJECT_ROOT="$PWD" -P tests/check-upstream-pins.cmake
      - name: Validate service definitions without compiling
        run: |
          cmake -DPROJECT_ROOT="$PWD" -P tests/check-services.cmake
          cmake -DPROJECT_ROOT="$PWD" -P tests/check-build-system.cmake
      - name: Validate manual workflow contracts without compiling
        run: perl tools/scripts/check-workflows.pl
      - name: Validate Shell and Make source policy without compiling
        run: perl tools/scripts/check-shell-policy.pl
      - name: Validate agent knowledge Perl contract
        run: |
          prove -v tests/agent_knowledge_validator/test_validator.t
          perl scripts/validate-agent-knowledge.pl --scope worktree

  perl-quality:
    name: Perl quality (Test::More and Perl::Critic)
    # Opt-in at dispatch time. libperl-critic-perl is a distribution
    # package, not a CPAN download; the job never runs for a normal
    # dispatch.
    if: ${{ inputs.perl_style == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install distribution Perl tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            perl libperl-critic-perl
          perl --version | head -2
          perlcritic --version
      - name: Compile maintained Perl
        run: |
          while IFS= read -r -d '' file; do
            perl -c "$file"
          done < <(git ls-files -z '*.pl' '*.pm' '*.t' 'tools/scripts/i2pdctl')
      - name: Run Test::More suites
        run: prove -v tools/tests/i2pdctl.t tools/tests/validate-branding.t tools/tests/perl-portability.t tools/tests/maintenance-checkers.t tools/tests/make-drivers.t tools/tests/interop-helpers.t tests/agent_knowledge_validator/test_validator.t
      - name: Run Perl::Critic
        run: |
          mapfile -d '' -t perl_files < <(git ls-files -z '*.pl' '*.pm' '*.t' 'tools/scripts/i2pdctl')
          perlcritic --profile .perlcriticrc "${perl_files[@]}"


  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            flags: "-DWITH_ADDRSANITIZER=ON -DWITH_UNDEFSANITIZER=ON"
            asan_options: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
            ubsan_options: "halt_on_error=1:print_stacktrace=1"
          - name: ubsan
            flags: "-DWITH_UNDEFSANITIZER=ON"
            asan_options: ""
            ubsan_options: "halt_on_error=1:print_stacktrace=1"
          - name: tsan
            flags: "-DWITH_THREADSANITIZER=ON"
            asan_options: ""
            ubsan_options: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest build tools from Homebrew
        timeout-minutes: 20
        uses: ./.github/actions/brew-toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 does not accept GitHub $/ self-repository syntax
      - name: Locate LLVM symbolizer
        run: |
          clang_path=$(readlink -f "$(command -v clang)")
          symbolizer="$(dirname "$clang_path")/llvm-symbolizer"
          if [ -n "$symbolizer" ]; then
            if [ -x "$symbolizer" ]; then
              echo "ASAN_SYMBOLIZER_PATH=$symbolizer" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          symbolizer=$(command -v llvm-symbolizer || true)
          if [ -n "$symbolizer" ] && [ -x "$symbolizer" ]; then
            echo "ASAN_SYMBOLIZER_PATH=$symbolizer" >> "$GITHUB_ENV"
          else
            echo "llvm-symbolizer unavailable; raw sanitizer PCs will be retained"
          fi
      - name: Build and run sanitizer CTest matrix
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
          SANITIZER_FLAGS: ${{ matrix.flags }}
          SANITIZER_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          cmake -S build -B build-sanitizers -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON -DWITH_UPNP=OFF \
            -DI2PD_REQUIRE_PERL=ON \
            -DI2PD_BUILD_TUI=ON -DI2PD_OPENSSL_EXPECT=OpenSSL \
            $SANITIZER_FLAGS 2>&1 | tee sanitizer-configure.log
          cmake --build build-sanitizers --parallel 2 2>&1 | tee sanitizer-build.log
          ctest --test-dir build-sanitizers -j 1 --output-on-failure \
            --no-tests=error --output-junit "$PWD/ctest-sanitizers-${SANITIZER_NAME}.xml"
      - name: Record sanitizer reproduction identities
        if: always()
        run: |
          mkdir -p sanitizer-evidence
          git rev-parse HEAD > sanitizer-evidence/revision.txt
          for image in test-eddsa test-i2ptunnel-stop test-i2ptunnel-targets \
            test-eciesx25519-ratchet-session test-runnableservice-lifecycle \
            test-i2cp-session-lifecycle; do
            image_path="build-sanitizers/tests/$image"
            if [ -f "$image_path" ]; then
              sha256sum "$image_path" >> sanitizer-evidence/images.sha256
            else
              echo "$image: not produced" >> sanitizer-evidence/missing-images.txt
            fi
          done
      - name: Upload sanitizer test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sanitizer-${{ matrix.name }}-logs
          path: |
            sanitizer-configure.log
            sanitizer-build.log
            build-sanitizers/CMakeCache.txt
            build-sanitizers/CMakeFiles/CMakeConfigureLog.yaml
            build-sanitizers/Testing
            build-sanitizers/tests/test-eddsa
            build-sanitizers/tests/test-i2ptunnel-stop
            build-sanitizers/tests/test-i2ptunnel-targets
            build-sanitizers/tests/test-eciesx25519-ratchet-session
            build-sanitizers/tests/test-runnableservice-lifecycle
            build-sanitizers/tests/test-i2cp-session-lifecycle
            sanitizer-evidence
            ctest-sanitizers-*.xml
          if-no-files-found: warn
          retention-days: 7

  fuzz-smoke:
    name: Bounded fuzz smoke checks
    runs-on: ubuntu-24.04
    # The step budgets below (20 toolchain + 30 build + 10 CTest smoke +
    # 25 bounded run + 5 upload) exceed 60 minutes, so the job cap must
    # not be smaller than their sum: a killed job would otherwise be
    # misread as a fuzz failure.
    timeout-minutes: 90
    env:
      ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1:abort_on_error=1:quarantine_size_mb=64:thread_local_quarantine_size_kb=256"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest build tools from Homebrew
        timeout-minutes: 20
        uses: ./.github/actions/brew-toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 does not accept GitHub $/ self-repository syntax
      - name: Build libFuzzer targets
        timeout-minutes: 30
        run: |
          cmake -S build -B build-fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON -DWITH_FUZZERS=ON -DWITH_ADDRSANITIZER=ON -DWITH_UNDEFSANITIZER=ON \
            -DI2PD_OPENSSL_EXPECT=OpenSSL \
            -DWITH_UPNP=OFF -DI2PD_BUILD_TUI=OFF
          cmake --build build-fuzz --parallel 2 --target \
            fuzz-tui-protocol fuzz-http-parser fuzz-protocol-bounds \
            fuzz-log-record fuzz-privsep-protocol fuzz-torrents-parsers \
            fuzz-torrents-krpc fuzz-torrents-extensions \
            fuzz-base-blinding fuzz-signature-der fuzz-i2np-policy \
            fuzz-i2np-database fuzz-ntcp2-blocks fuzz-sam-control fuzz-i2cp-message
      - name: Run one-input CTest fuzz smoke entries
        timeout-minutes: 10
        run: |
          ctest --test-dir build-fuzz -j 2 --output-on-failure \
            -L fuzz --no-tests=error --timeout 60 \
            --output-junit "$PWD/ctest-fuzz.xml"
      - name: Run bounded fuzz smoke checks
        timeout-minutes: 25
        env:
          FUZZ_SECONDS: ${{ inputs.fuzz_seconds }}
        run: |
          case "$FUZZ_SECONDS" in
            ''|*[!0-9]*)
              echo "fuzz_seconds must be a non-negative integer" >&2
              exit 1
              ;;
          esac
          artifact_root="$RUNNER_TEMP/fuzz-artifacts"
          mkdir -p "$artifact_root"
          summary="$RUNNER_TEMP/fuzz-summary.md"
          printf '| Fuzzer | Result |\n|---|---|\n' > "$summary"
          rc=0
          for fuzzer in \
            fuzz-tui-protocol fuzz-http-parser fuzz-protocol-bounds \
            fuzz-log-record fuzz-privsep-protocol fuzz-torrents-parsers \
            fuzz-torrents-krpc fuzz-torrents-extensions \
            fuzz-base-blinding fuzz-signature-der fuzz-i2np-policy \
            fuzz-i2np-database fuzz-ntcp2-blocks fuzz-sam-control fuzz-i2cp-message
          do
            corpus="$RUNNER_TEMP/corpus/$fuzzer"
            artifact_dir="$artifact_root/$fuzzer"
            log="$RUNNER_TEMP/fuzz-$fuzzer.log"
            mkdir -p "$corpus" "$artifact_dir"
            if [ -d "tests/fuzz/corpus/$fuzzer" ]; then
              cp -a "tests/fuzz/corpus/$fuzzer/." "$corpus"/
            fi
            if "build-fuzz/tests/$fuzzer" \
              -max_total_time="$FUZZ_SECONDS" \
              -timeout=10 \
              -max_len=65536 \
              -rss_limit_mb=6144 \
              -malloc_limit_mb=6144 \
              -print_final_stats=1 \
              -artifact_prefix="$artifact_dir/" \
              "$corpus" >"$log" 2>&1; then
              printf '| %s | pass |\n' "$fuzzer" >> "$summary"
            else
              printf '| %s | **FAIL** |\n' "$fuzzer" >> "$summary"
              tail -n 20 "$log" >> "$summary"
              rc=1
            fi
          done
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Stage fuzz corpora and crash artifacts
        if: always()
        run: |
          mkdir -p fuzz-output
          cp -a "$RUNNER_TEMP/fuzz-artifacts" "$RUNNER_TEMP/corpus" fuzz-output/ 2>/dev/null || true
          find fuzz-output -type f -print | sort | sed -n '1,80p'
      - name: Upload fuzz corpora and crash artifacts
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-corpus-and-artifacts
          path: |
            fuzz-output
            build-fuzz/Testing
            ctest-fuzz.xml
          if-no-files-found: warn
          retention-days: 7
