# license details.
#
# openi2pd: build openbsd.
#
# Configures build and manual CI integration.
#

---
name: OpenBSD

# Automatic runs are intentionally suspended during the refactoring.
# Only a maintainer may start this workflow manually from the Actions
# tab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: OpenBSD 8.0 build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare OpenBSD VM
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3  # v1.4.9
        with:
          release: '8.0'
          arch: x86_64
          cpu: 2
          mem: 6144
          copyback: true
          sync: rsync
          custom-shell-name: openbsd
          prepare: |
            set -eu
            pkg_add cmake ninja boost miniupnpc llvm libcxx git
      # The pinned custom shell copies files back after a failed command
      # and returns its original status; the action's run input does not.
      - name: Build and test inside OpenBSD
        shell: openbsd {0}  # zizmor: ignore[misfeature] custom shell required by vmactions/openbsd-vm failure copyback
        run: |
          set -eu
          if ! cmake -S build -B build-output -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DI2PD_REQUIRE_PERL=ON \
            -DI2PD_OPENSSL_EXPECT=LibreSSL > configure.log 2>&1; then
            cat configure.log
            exit 1
          fi
          cat configure.log
          grep -q 'OpenSSL library    : LibreSSL' configure.log
          if cmake --build build-output --parallel 2 > build.log 2>&1; then
            cat build.log
          else
            build_status=$?
            cat build.log
            exit "$build_status"
          fi
          test -x build-output/i2pd-tui
          ctest --test-dir build-output -j 2 --output-on-failure \
            --no-tests=error --output-junit "$PWD/ctest-openbsd.xml"
          ctest --test-dir build-output -N -L platform --no-tests=error
          # The VM shell is root. Stage only these two executables in a
          # private directory for the unprivileged credential cases.
          # The account uses the base system's non-writable empty home.
          useradd -d /var/empty -g =uid -s /bin/sh openi2pd-ci
          credential_dir=$(mktemp -d /tmp/openi2pd-credentials.XXXXXXXX)
          chown openi2pd-ci "$credential_dir"
          for name in test-privsep-worker-identity test-privsep-credentials; do
            install -m 0555 "build-output/tests/$name" "$credential_dir/$name"
            printf 'add_test(%s "./%s")\n' "$name" "$name"
            printf 'set_tests_properties(%s PROPERTIES TIMEOUT 120 SKIP_RETURN_CODE 77)\n' "$name"
          done > "$credential_dir/CTestTestfile.cmake"
          credential_status=0
          su -s /bin/sh openi2pd-ci -c '
            set -eu
            test "$(id -u)" -ne 0
            test -d /var/empty
            test ! -w /var/empty
            cd "$1"
            exec /usr/local/bin/ctest --test-dir . -j 1 --output-on-failure \
              --no-tests=error --output-junit credentials.xml
          ' sh "$credential_dir" || credential_status=$?
          if [ -f "$credential_dir/credentials.xml" ]; then
            cp "$credential_dir/credentials.xml" ctest-openbsd-credentials.xml
          fi
          if [ "$credential_status" -ne 0 ]; then
            exit "$credential_status"
          fi
          test -s ctest-openbsd-credentials.xml
          for name in test-privsep-worker-identity test-privsep-credentials; do
            grep -Fq "name=\"$name\"" ctest-openbsd-credentials.xml
          done
          if grep -Eq '<skipped([[:space:]]|/|>)' ctest-openbsd-credentials.xml; then
            echo 'OpenBSD non-root credential coverage was skipped' >&2
            exit 1
          fi
          # Keep the root-started probe outside the private stage owned
          # by the unprivileged account. Only its child drops credentials.
          drop_dir=$(mktemp -d /tmp/openi2pd-credential-drop.XXXXXXXX)
          install -m 0555 build-output/tests/test-privsep-credentials "$drop_dir/"
          cat > "$drop_dir/CTestTestfile.cmake" <<'EOF'
          add_test(test-privsep-credential-drop "./test-privsep-credentials" "--verify-privileged-drop" "openi2pd-ci")
          set_tests_properties(test-privsep-credential-drop PROPERTIES TIMEOUT 120)
          EOF
          ctest --test-dir "$drop_dir" -j 1 --output-on-failure \
            --no-tests=error --output-junit "$PWD/ctest-openbsd-credential-drop.xml"
          make BUILD_DIR=build-make \
            CMAKE_FLAGS="-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DI2PD_OPENSSL_EXPECT=LibreSSL" \
            router
          test -x build-make/i2pd
      - name: Upload OpenBSD test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: openbsd-ctest
          path: |
            build-output/Testing
            configure.log
            build.log
            ctest-openbsd.xml
            ctest-openbsd-credentials.xml
            ctest-openbsd-credential-drop.xml
          if-no-files-found: warn
          retention-days: 7
