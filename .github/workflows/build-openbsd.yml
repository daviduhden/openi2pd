#
# openi2pd: build openbsd.
#
# Configures build and manual CI integration.
#

---
name: OpenBSD

# Automatic runs are intentionally suspended during the refactoring. Only a
# maintainer may start this workflow manually from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3  # v1.4.9
        with:
          release: '8.0'
          arch: x86_64
          cpu: 2
          mem: 6144
          copyback: true
          prepare: |
            set -eu
            pkg_add cmake ninja boost miniupnpc ncurses llvm libcxx
          run: |
            set -eu
            cmake -S build -B build-output -G Ninja \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
              -DI2PD_OPENSSL_EXPECT=LibreSSL
            cmake --build build-output --parallel 2
            test -x build-output/i2pd-tui
            ctest --test-dir build-output --output-on-failure --timeout 180
            ctest --test-dir build-output -N -L platform --no-tests=error
            make BUILD_DIR=build-make \
              CMAKE_FLAGS="-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DI2PD_OPENSSL_EXPECT=LibreSSL" \
              router
            test -x build-make/i2pd
      - name: Upload OpenBSD test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: openbsd-ctest
          path: build-output/Testing
          if-no-files-found: warn
          retention-days: 7
