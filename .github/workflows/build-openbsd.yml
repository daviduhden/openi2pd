name: Build on OpenBSD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openbsd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: OpenBSD 7.9
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test in OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          arch: x86_64
          cpu: 2
          mem: 6144
          copyback: false
          prepare: |
            set -eu
            pkg_add cmake boost miniupnpc
          run: |
            set -eu
            uname -a
            cmake -S build -B build-output \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=ON
            grep -q '^WITH_UPNP:BOOL=ON$' build-output/CMakeCache.txt
            cmake --build build-output --parallel 2
            ctest --test-dir build-output --output-on-failure
            ./build-output/i2pd --version
