name: OpenBSD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          arch: x86_64
          cpu: 2
          mem: 6144
          copyback: false
          prepare: |
            set -eu
            pkg_add cmake boost miniupnpc
          run: |
            set -eu
            cmake -S build -B build-output \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
            cmake --build build-output --parallel 2 --target i2pd test-http-url test-http-req test-base-64 test-aes test-aeadchacha20poly1305
            ctest --test-dir build-output --output-on-failure --timeout 30 -R '^test-(http-url|http-req|base-64|aes|aeadchacha20poly1305)$'
