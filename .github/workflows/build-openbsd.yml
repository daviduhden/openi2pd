---
name: OpenBSD

# Automatic runs are intentionally suspended during the refactoring. Only a
# maintainer may start this workflow manually from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945  # v1
        with:
          release: '7.9'
          arch: x86_64
          cpu: 2
          mem: 6144
          copyback: false
          prepare: |
            set -eu
            pkg_add cmake ninja boost miniupnpc
          run: |
            set -eu
            cmake -S build -B build-output -G Ninja \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
            cmake --build build-output --parallel 2
            ctest --test-dir build-output --output-on-failure --timeout 60
