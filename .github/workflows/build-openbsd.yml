#
# openi2pd: build openbsd.
#
# Configures build and manual CI integration.
#

---
name: OpenBSD

# Automatic runs are intentionally suspended during the refactoring.
# Only a maintainer may start this workflow manually from the Actions
# tab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare OpenBSD VM
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3  # v1.4.9
        with:
          release: '8.0'
          arch: x86_64
          cpu: 2
          mem: 6144
          copyback: true
          sync: rsync
          custom-shell-name: openbsd
          prepare: |
            set -eu
            pkg_add cmake ninja boost miniupnpc llvm libcxx git
      # The pinned custom shell copies files back after a failed command
      # and returns its original status; the action's run input does not.
      - name: Build and test inside OpenBSD
        shell: openbsd {0}
        run: |
          set -eu
          if ! cmake -S build -B build-output -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DI2PD_REQUIRE_PERL=ON \
            -DI2PD_OPENSSL_EXPECT=LibreSSL > configure.log 2>&1; then
            cat configure.log
            exit 1
          fi
          cat configure.log
          grep -q 'OpenSSL library    : LibreSSL' configure.log
          if cmake --build build-output --parallel 2 > build.log 2>&1; then
            cat build.log
          else
            build_status=$?
            cat build.log
            exit "$build_status"
          fi
          test -x build-output/i2pd-tui
          ctest --test-dir build-output -j 2 --output-on-failure \
            --no-tests=error --output-junit "$PWD/ctest-openbsd.xml"
          ctest --test-dir build-output -N -L platform --no-tests=error
          make BUILD_DIR=build-make \
            CMAKE_FLAGS="-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DI2PD_OPENSSL_EXPECT=LibreSSL" \
            router
          test -x build-make/i2pd
      - name: Upload OpenBSD test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: openbsd-ctest
          path: |
            build-output/Testing
            configure.log
            build.log
            ctest-openbsd.xml
          if-no-files-found: warn
          retention-days: 7
