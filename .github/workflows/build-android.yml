# See the LICENSE file at the top of the project tree for copyright and
# license details.
#
# openi2pd: build Android.
#
# Configures build and manual CI integration.
#

---
name: Android

# All runs are manual. Do not add push, pull_request, schedule or
# workflow_call triggers: this repository validates every revision only
# when a maintainer explicitly dispatches the workflow.
on:
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign the production arm64 APK after environment approval
        type: boolean
        default: false
      android_ui:
        description: 'Run the API 29 emulator UI/accessibility lane (x86_64)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android arm64 build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      unsigned-apk-id: ${{ steps.unsigned-apk.outputs.artifact-id }}
    env:
      I2PD_ANDROID_CMAKE_ARGS: >-
        -DWITH_HARDENING=ON
        -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android
        -DBOOST_ROOT=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android
        -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH
        -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH
        -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up OpenJDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache Gradle distributions and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', 'android/gradle.properties') }}
      - name: Validate Android Gradle toolchain
        run: |
          sh android/tools/java25-probe/check-config.sh
          perl android/tools/compact-vector-paths.pl
          perl android/tools/check-android-locales.pl
          # The compile-free Javadoc guard fails in seconds on a comment
          # defect that the mandatory :i2pd:sourceJavadoc step (-Werror)
          # would only reach after the native and JVM build.
          perl android/tools/check-android-javadoc.pl
          cd android
          ./gradlew --version --no-daemon
      - name: Install Android platform used by the app
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set" >&2
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"
          # `yes` receives SIGPIPE when sdkmanager closes stdin; disable
          # pipefail only for this pipeline so the sdkmanager status
          # stays authoritative instead of masking a real license
          # failure.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          # AGP may resolve compileSdk 37 to android-37 or the
          # minor-versioned android-37.0 package. Accept either
          # installed directory and export the resolved android.jar for
          # the D8/R8 probe.
          PLATFORM_DIR=$(find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-37*' | sort | head -1)
          test -n "$PLATFORM_DIR"
          test -f "$PLATFORM_DIR/android.jar"
          echo "ANDROID_JAR=$PLATFORM_DIR/android.jar" >> "$GITHUB_ENV"
          ls -1 "$ANDROID_HOME/platforms"
      - name: Checkout vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: microsoft/vcpkg
          ref: bf19794383e8fb95eba5aa553235bc8ec2271688
          path: .ci-vcpkg
      - name: Prepare Android toolchain
        run: |
          test -d "$ANDROID_NDK_HOME"
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/.ci-vcpkg" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$(basename "$ANDROID_NDK_HOME")" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          .ci-vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Cache Android dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: android-arm64-android-29-${{ env.NDK_VERSION }}-${{ hashFiles('contrib/ci/android/*') }}
      - name: Build Android arm64
        run: |
          cmake -S build -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/contrib/ci/android" \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/contrib/ci/android" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DI2PD_BUILD_JNI=ON -DWITH_BINARY=OFF -DWITH_HARDENING=ON \
            -DI2PD_OPENSSL_EXPECT=OpenSSL
          cmake --build build-android --parallel 2 --target i2pd_jni
          file build-android/libi2pd.so | grep 'ARM aarch64'
      - name: Android unit tests and Lint
        run: |
          cd android
          ./gradlew :i2pd:testDebugUnitTest :i2pd:lintDebug --no-daemon \
            -Pi2pd.ndkVersion="$NDK_VERSION" \
            -Pi2pd.abis=arm64-v8a \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pi2pd.cmakeArgs="$I2PD_ANDROID_CMAKE_ARGS"
      - name: Generate and check Android Javadoc
        run: |
          cd android
          ./gradlew :i2pd:sourceJavadoc --no-daemon \
            -Pi2pd.ndkVersion="$NDK_VERSION" \
            -Pi2pd.abis=arm64-v8a \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pi2pd.cmakeArgs="$I2PD_ANDROID_CMAKE_ARGS"
      - name: Assert Android JVM tests actually ran
        run: |
          test -n "$(find android/app/build/test-results/testDebugUnitTest -name '*.xml' -print -quit)"
          ! grep -R -E '<(failure|error)' android/app/build/test-results/testDebugUnitTest
      - name: Assert Java 25 class-file output
        run: |
          class_file=$(find android/app/build/intermediates/javac/debug -name RouterService.class -print -quit)
          test -n "$class_file"
          javap_out=$(mktemp)
          javap -verbose "$class_file" > "$javap_out"
          grep -q 'major version: 69' "$javap_out" \
            || { echo "RouterService.class is not class-file major 69" >&2; exit 1; }
          rm -f "$javap_out"
      - name: Build debug APK for arm64
        run: |
          cd android
          ./gradlew :i2pd:assembleDebug :i2pd:assembleDebugAndroidTest \
            :i2pd:assembleRelease :i2pd:lintRelease --no-daemon \
            -Pi2pd.ndkVersion="$NDK_VERSION" \
            -Pi2pd.abis=arm64-v8a \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pi2pd.cmakeArgs="$I2PD_ANDROID_CMAKE_ARGS"
          find_application_apk() {
            variant=$1
            while IFS= read -r -d '' candidate; do
              case "$candidate" in
                *androidTest*) continue ;;
                *"$variant"*|*"${variant^}"*) ;;
                *) continue ;;
              esac
              contents=$(unzip -Z1 "$candidate" 2>/dev/null) || continue
              if grep -Fxq 'lib/arm64-v8a/libi2pd.so' <<<"$contents" \
                && grep -Fxq 'assets/i2pd.conf' <<<"$contents" \
                && grep -Eq '^classes([0-9]+)?\.dex$' <<<"$contents"; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done < <(find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print0)
            return 1
          }
          apk=$(find_application_apk debug) || {
            echo "debug app APK with arm64 JNI library not found; APK outputs present:" >&2
            find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print >&2
            exit 1
          }
          printf 'I2PD_DEBUG_APK=%s\n' "$apk" >> "$GITHUB_ENV"
          listing=$(unzip -l "$apk")
          # Query a here-string: a pipe into `grep -q` lets the reader exit
          # after the first match, and under `pipefail` the producer's
          # SIGPIPE would then be reported instead of the assertion result.
          grep -q 'lib/arm64-v8a/libi2pd.so' <<<"$listing" \
            || { echo "debug APK does not package lib/arm64-v8a/libi2pd.so" >&2; exit 1; }
          grep -q 'lib/arm64-v8a/libc++_shared.so' <<<"$listing" \
            || { echo "debug APK does not package libc++_shared.so" >&2; exit 1; }
          grep -q 'assets/i2pd.conf' <<<"$listing" \
            || { echo "debug APK does not package the bundled i2pd.conf" >&2; exit 1; }
          expected_certs=$(find ../contrib/certificates -type f -name '*.crt' | wc -l | tr -d ' ')
          actual_certs=$(grep -cE 'assets/certificates/.*\.crt$' <<<"$listing" || true)
          test "$actual_certs" -eq "$expected_certs" \
            || { echo "APK has $actual_certs certificates, expected $expected_certs" >&2; exit 1; }
          # Extract before reading: `unzip -p | od -N4 | grep -q` stops the
          # reader after four bytes, so the producer's SIGPIPE would fail
          # the step wherever `pipefail` is active.
          dex_file=$(mktemp)
          unzip -p "$apk" classes.dex > "$dex_file"
          magic=$(od -An -t x1 -N4 "$dex_file" | tr -d ' \n')
          rm -f "$dex_file"
          test "$magic" = "6465780a" \
            || { echo "debug APK classes.dex has no dex magic" >&2; exit 1; }
          native=$(mktemp)
          unzip -p "$apk" lib/arm64-v8a/libi2pd.so > "$native"
          file "$native" | grep -q 'ARM aarch64' \
            || { echo "packaged libi2pd.so is not aarch64" >&2; exit 1; }
          symbols=$(nm -D --defined-only "$native")
          rm -f "$native"
          grep -q 'Java_org_openi2pd_router_I2PD' <<<"$symbols" \
            || { echo "packaged libi2pd.so exports no JNI entry points" >&2; exit 1; }
          if ! find_application_apk release >/dev/null; then
            echo "release app APK with arm64 JNI library not found; APK outputs present:" >&2
            find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print >&2
            exit 1
          fi
      - name: Probe Java 25 D8/R8 dexing
        run: |
          # Use AGP's resolved dependency, never an unrelated cached R8.
          (cd android && ./gradlew --no-daemon writeJava25R8Classpath)
          R8_JAR=$(cat android/build/reports/java25/r8-classpath.txt)
          test -f "$R8_JAR"
          "$JAVA_HOME/bin/java" -cp "$R8_JAR" com.android.tools.r8.D8 --version \
            > android/build/reports/java25/r8-version.txt
          cat android/build/reports/java25/r8-version.txt
          test -f "$ANDROID_JAR"
          ANDROID_JAR="$ANDROID_JAR" R8_JAR="$R8_JAR" \
            sh android/tools/java25-probe/verify-java25.sh
      - name: Show Android lint report on failure
        if: failure()
        run: |
          for report in android/app/build/reports/lint-results-debug.txt android/app/build/reports/lint-results-release.txt; do
            if [ -f "$report" ]; then cat "$report"; fi
          done
      - name: Check Android JNI declarations
        run: perl android/tools/check-android-jni-symbols.pl
      - name: Verify Java 25 dex lowering
        run: |
          apk="$I2PD_DEBUG_APK"
          dex=$(mktemp)
          unzip -p "$apk" classes.dex > "$dex"
          version=$(od -An -t u1 -j4 -N3 "$dex" | tr -d ' \n')
          test "$version" = "485157" \
            || { echo "APK classes.dex is not DEX 039 (got $version)" >&2; exit 1; }
          # D8 must remove the record superclass, record ObjectMethods
          # bootstrap and the sealed type-switch/MatchException
          # references at minSdk 29. A surviving reference would fail on
          # ART 10.
          strings_out=$(mktemp)
          strings "$dex" > "$strings_out"
          if grep -Eq 'java/lang/Record|ObjectMethods|SwitchBootstraps|MatchException' "$strings_out"; then
            echo "DEX still contains a Java 25 bootstrap unavailable on ART 29" >&2
            rm -f "$strings_out" "$dex"
            exit 1
          fi
          rm -f "$strings_out" "$dex"
      - name: Stage Android APK artifacts
        if: always()
        run: |
          mkdir -p android-apk-artifacts
          find "$GITHUB_WORKSPACE" -type f -name '*.apk' \
            ! -path "$GITHUB_WORKSPACE/android-apk-artifacts/*" -print0 |
            while IFS= read -r -d '' apk; do
              relative=${apk#"$GITHUB_WORKSPACE"/}
              mkdir -p "android-apk-artifacts/$(dirname "$relative")"
              cp "$apk" "android-apk-artifacts/$relative"
            done
      - name: Upload Android reports and APKs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-arm64-reports
          path: |
            android/app/build/reports
            android/build/reports/java25
            android/app/build/test-results
            android-apk-artifacts
            android/**/build/outputs/apk
            android/app/build/docs/javadoc
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare production APK for signing
        if: ${{ inputs.sign_release && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          mapfile -d '' -t apks < <(find android/app/build -type f -name 'i2pd-arm64-v8a-release-unsigned.apk' -print0)
          test "${#apks[@]}" -eq 1
          mkdir -p android-signing-input
          cp "${apks[0]}" android-signing-input/openi2pd-release-unsigned.apk
          listing=$(unzip -Z1 "${apks[0]}")
          for library in libi2pd.so libc++_shared.so; do
            entry="lib/arm64-v8a/$library"
            grep -Fxq "$entry" <<<"$listing"
            unzip -p "${apks[0]}" "$entry" > "android-signing-input/$library"
            readelf -lW "android-signing-input/$library" | gawk '
              $1 == "LOAD" { count++; if (strtonum($NF) < 16384) bad = 1 }
              END { exit (!count || bad) }'
          done
          (cd android-signing-input && sha256sum openi2pd-release-unsigned.apk > SHA256SUMS)
      - name: Upload unsigned production APK
        id: unsigned-apk
        if: ${{ inputs.sign_release && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-production-unsigned
          path: |
            android-signing-input/openi2pd-release-unsigned.apk
            android-signing-input/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  android-sign:
    name: Sign Android production APK
    if: ${{ inputs.sign_release && github.ref == 'refs/heads/main' }}
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: android-openi2pd-release
    permissions: {}
    steps:
      - name: Require one build artifact ID
        shell: bash
        env:
          APK_ARTIFACT_ID: ${{ needs.android.outputs.unsigned-apk-id }}
        run: '[[ "$APK_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - name: Download the exact unsigned artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          artifact-ids: ${{ needs.android.outputs.unsigned-apk-id }}
          merge-multiple: true
          path: signing-input
      - name: Inspect and align production APK
        shell: bash
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          (cd signing-input && sha256sum -c SHA256SUMS)
          apk=signing-input/openi2pd-release-unsigned.apk
          unzip -tq "$apk"
          badging=$("$tools/aapt2" dump badging "$apk")
          grep -q "^package: name='dev.uhden.i2pd' versionCode='[0-9]\{1,\}'" <<<"$badging"
          grep -Fxq "sdkVersion:'29'" <<<"$badging"
          if grep -q '^application-debuggable' <<<"$badging"; then
            echo "Production APK is debuggable" >&2
            exit 1
          fi
          listing=$(unzip -Z1 "$apk")
          grep -Fxq 'lib/arm64-v8a/libi2pd.so' <<<"$listing"
          grep -Fxq 'lib/arm64-v8a/libc++_shared.so' <<<"$listing"
          if grep -Eiq '^META-INF/.*[.](RSA|DSA|EC|SF)$' <<<"$listing"; then
            echo "Expected an unsigned APK" >&2
            exit 1
          fi
          if "$tools/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "Expected an unsigned APK" >&2
            exit 1
          fi
          "$tools/zipalign" -P 16 -f 4 "$apk" signing-input/aligned.apk
      - name: Sign aligned APK
        shell: bash
        env:
          OPENI2PD_KEYSTORE_BASE64: ${{ secrets.OPENI2PD_KEYSTORE_BASE64 }}
          OPENI2PD_KEYSTORE_PASSWORD: ${{ secrets.OPENI2PD_KEYSTORE_PASSWORD }}
          EXPECTED_CERT: ${{ vars.OPENI2PD_CERT_SHA256 }}
        run: |
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/openi2pd.XXXXXX")
          trap 'unlink "$keystore"' EXIT
          trap 'exit 1' HUP INT TERM
          test -n "$OPENI2PD_KEYSTORE_BASE64"
          test -n "$OPENI2PD_KEYSTORE_PASSWORD"
          printf '%s' "$OPENI2PD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset OPENI2PD_KEYSTORE_BASE64
          [[ "$EXPECTED_CERT" =~ ^[0-9a-f]{64}$ ]]
          digest=$(keytool -exportcert -storetype PKCS12 -keystore "$keystore" \
            -alias openi2pd -storepass:env OPENI2PD_KEYSTORE_PASSWORD | sha256sum)
          test "${digest%% *}" = "$EXPECTED_CERT"
          mkdir signed-android
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" --ks-type PKCS12 --ks-key-alias openi2pd \
            --ks-pass env:OPENI2PD_KEYSTORE_PASSWORD \
            --min-sdk-version 29 --v1-signing-enabled false \
            --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false \
            --out signed-android/openi2pd-release.apk signing-input/aligned.apk
      - name: Verify production certificate and APK integrity
        shell: bash
        env:
          EXPECTED_CERT: ${{ vars.OPENI2PD_CERT_SHA256 }}
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=signed-android/openi2pd-release.apk
          [[ "$EXPECTED_CERT" =~ ^[0-9a-f]{64}$ ]]
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          # API 24 forces verification of v2 as well as v3.
          "$tools/apksigner" verify --min-sdk-version 24 --verbose --print-certs "$apk" > signed-android/certificate.txt
          cat signed-android/certificate.txt
          grep -Fxq 'Number of signers: 1' signed-android/certificate.txt
          grep -Fxq 'Verified using v2 scheme (APK Signature Scheme v2): true' signed-android/certificate.txt
          grep -Fxq 'Verified using v3 scheme (APK Signature Scheme v3): true' signed-android/certificate.txt
          grep -Fxq "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT" signed-android/certificate.txt
          if grep -Eiq '^Signer #[0-9]+ certificate DN:.*CN=Android Debug' signed-android/certificate.txt; then
            echo "Debug signer is forbidden" >&2
            exit 1
          fi
          badging=$("$tools/aapt2" dump badging "$apk")
          grep -q "^package: name='dev.uhden.i2pd' versionCode='[0-9]\{1,\}'" <<<"$badging"
          grep -Fxq "sdkVersion:'29'" <<<"$badging"
          if grep -q '^application-debuggable' <<<"$badging"; then
            echo "Production APK is debuggable" >&2
            exit 1
          fi
          listing=$(unzip -Z1 "$apk")
          for library in libi2pd.so libc++_shared.so; do
            grep -Fxq "lib/arm64-v8a/$library" <<<"$listing"
          done
          original_badging=$("$tools/aapt2" dump badging signing-input/openi2pd-release-unsigned.apk)
          test "${badging%%$'\n'*}" = "${original_badging%%$'\n'*}"
          for library in libi2pd.so libc++_shared.so; do
            entry="lib/arm64-v8a/$library"
            original_digest=$(unzip -p signing-input/openi2pd-release-unsigned.apk "$entry" | sha256sum)
            signed_digest=$(unzip -p "$apk" "$entry" | sha256sum)
            test "$original_digest" = "$signed_digest"
          done
          cd signed-android
          sha256sum openi2pd-release.apk > SHA256SUMS
      - name: Publish verified signed APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: openi2pd-android-release
          path: signed-android/
          if-no-files-found: error

  android-ui:
    name: Android API 29 UI and accessibility
    # Opt-in at dispatch time. This lane needs an x86_64 native build
    # plus an API 29 system image, so a normal Android dispatch stays
    # arm64-only. It exercises the prepared Espresso/contract tests on a
    # real ART image; it is not evidence for the arm64 device matrix.
    if: ${{ inputs.android_ui == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      I2PD_ANDROID_CMAKE_ARGS: >-
        -DWITH_HARDENING=ON
        -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x64-android
        -DBOOST_ROOT=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x64-android
        -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH
        -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH
        -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up OpenJDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache Gradle distributions and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-ui-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', 'android/gradle.properties') }}
      - name: Validate Android Gradle toolchain
        run: |
          sh android/tools/java25-probe/check-config.sh
          perl android/tools/compact-vector-paths.pl
          perl android/tools/check-android-locales.pl
          perl android/tools/check-android-jni-symbols.pl
          cd android
          ./gradlew --version --no-daemon
      - name: Install SDK, emulator and API 29 image
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set" >&2
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;30.0.16248370" \
            "emulator" \
            "system-images;android-29;google_apis;x86_64" \
            "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/platform-tools/adb"
      - name: Checkout vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: microsoft/vcpkg
          ref: bf19794383e8fb95eba5aa553235bc8ec2271688
          path: .ci-vcpkg
      - name: Prepare Android toolchain
        run: |
          test -d "$ANDROID_NDK_HOME"
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/.ci-vcpkg" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$(basename "$ANDROID_NDK_HOME")" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          .ci-vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Cache Android x86_64 dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: android-x64-android-29-${{ env.NDK_VERSION }}-${{ hashFiles('contrib/ci/android/*') }}
      - name: Build Android x86_64
        run: |
          # vcpkg names this architecture x64; Android's ABI is x86_64.
          # The overlay pins dependencies to the app's API 29 floor.
          cmake -S build -B build-android-x86_64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/contrib/ci/android" \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/contrib/ci/android" \
            -DVCPKG_TARGET_TRIPLET=x64-android \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DI2PD_BUILD_JNI=ON -DWITH_BINARY=OFF -DWITH_HARDENING=ON \
            -DI2PD_OPENSSL_EXPECT=OpenSSL
          cmake --build build-android-x86_64 --parallel 2 --target i2pd_jni
          file build-android-x86_64/libi2pd.so | grep 'x86-64'
      - name: Boot API 29 emulator
        timeout-minutes: 12
        run: |
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if [ ! -x "$AVDMANAGER" ]; then
            AVDMANAGER="$(command -v avdmanager)"
          fi
          test -x "$AVDMANAGER"
          echo "no" | "$AVDMANAGER" create avd --force --name openi2pd-api29 \
            --package "system-images;android-29;google_apis;x86_64" --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd openi2pd-api29 -port 5554 -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          ADB="$ANDROID_HOME/platform-tools/adb"
          require_emulator() {
            if kill -0 "$emulator_pid" 2>/dev/null; then
              return
            fi
            if wait "$emulator_pid"; then status=0; else status=$?; fi
            echo "Emulator exited during startup (status $status)" >&2
            tail -n 100 "$RUNNER_TEMP/emulator.log"
            exit 1
          }
          device_deadline=$((SECONDS + 180))
          while :; do
            require_emulator
            if (( SECONDS >= device_deadline )); then
              echo "Emulator did not connect to ADB within 180 seconds" >&2
              tail -n 100 "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            if state=$(timeout --kill-after=2s 5s "$ADB" -s emulator-5554 get-state 2>/dev/null) &&
              [[ "$state" == device ]]; then
              break
            fi
            sleep 2
          done
          boot_deadline=$((SECONDS + 420))
          until [ "$(timeout --kill-after=2s 10s "$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do
            require_emulator
            if (( SECONDS >= boot_deadline )); then
              tail -n 100 "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            sleep 3
          done
          timeout --kill-after=2s 10s "$ADB" -s emulator-5554 shell settings put global window_animation_scale 0
          timeout --kill-after=2s 10s "$ADB" -s emulator-5554 shell settings put global transition_animation_scale 0
          timeout --kill-after=2s 10s "$ADB" -s emulator-5554 shell settings put global animator_duration_scale 0
          timeout --kill-after=2s 10s "$ADB" -s emulator-5554 shell input keyevent 82
          timeout --kill-after=2s 10s "$ADB" -s emulator-5554 shell getprop ro.build.version.sdk
      - name: Run UI and accessibility instrumentation tests
        run: |
          cd android
          ./gradlew :i2pd:connectedDebugAndroidTest --no-daemon \
            -Pi2pd.ndkVersion="$NDK_VERSION" \
            -Pi2pd.abis=x86_64 \
            -Pandroid.injected.build.abi=x86_64 \
            -Pi2pd.cmakeArgs="$I2PD_ANDROID_CMAKE_ARGS"
          results=app/build/outputs/androidTest-results/connected
          test -n "$(find "$results" -name '*.xml' -print -quit)" \
            || { echo "connectedDebugAndroidTest produced no XML report" >&2; exit 1; }
          ! grep -R -E '<(failure|error)' "$results"
      - name: Collect emulator diagnostics on failure
        if: failure()
        timeout-minutes: 1
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          if [[ -f "$RUNNER_TEMP/emulator.log" ]]; then
            tail -n 100 "$RUNNER_TEMP/emulator.log"
          fi
          if ! timeout --kill-after=5s 15s "$ADB" -s emulator-5554 logcat -d -v threadtime > "$RUNNER_TEMP/logcat.txt"; then
            echo "ADB logcat did not complete; retaining any partial output" >&2
          fi
      - name: Upload Android UI reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-api29-ui-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/androidTest-results
            android/app/build/test-results
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/logcat.txt
          if-no-files-found: warn
          retention-days: 7
