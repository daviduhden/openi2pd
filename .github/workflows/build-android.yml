# license details.
#
# openi2pd: build Android.
#
# Configures build and manual CI integration.
#

---
name: Android

# All runs are manual. Do not add push, pull_request, schedule or
# workflow_call triggers: this repository validates every revision only
# when a maintainer explicitly dispatches the workflow.
on:
  workflow_dispatch:
    inputs:
      android_ui:
        description: 'Run the API 29 emulator UI/accessibility lane (x86_64)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      I2PD_ANDROID_CMAKE_ARGS: >-
        -DWITH_HARDENING=ON
        -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android
        -DBOOST_ROOT=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android
        -DBOOST_INCLUDEDIR=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android/include
        -DBOOST_LIBRARYDIR=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android/lib
        -DBoost_INCLUDE_DIR=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android/include
        -DBoost_LIBRARY_DIR_RELEASE=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android/lib
        -DBoost_LIBRARY_DIR_DEBUG=${{ github.workspace }}/build-android/vcpkg_installed/arm64-android/lib
        -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH
        -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH
        -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up OpenJDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache Gradle distributions and dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', 'android/gradle.properties') }}
      - name: Validate Android Gradle toolchain
        run: |
          sh android/tools/java25-probe/check-config.sh
          perl android/tools/check-android-locales.pl
          cd android
          ./gradlew --version --no-daemon
      - name: Install Android platform used by the app
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set" >&2
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"
          # `yes` receives SIGPIPE when sdkmanager closes stdin; disable
          # pipefail only for this pipeline so the sdkmanager status
          # stays authoritative instead of masking a real license
          # failure.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          # AGP may resolve compileSdk 37 to android-37 or the
          # minor-versioned android-37.0 package. Accept either
          # installed directory and export the resolved android.jar for
          # the D8/R8 probe.
          PLATFORM_DIR=$(find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-37*' | sort | head -1)
          test -n "$PLATFORM_DIR"
          test -f "$PLATFORM_DIR/android.jar"
          echo "ANDROID_JAR=$PLATFORM_DIR/android.jar" >> "$GITHUB_ENV"
          ls -1 "$ANDROID_HOME/platforms"
      - name: Checkout vcpkg
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          repository: microsoft/vcpkg
          ref: bf19794383e8fb95eba5aa553235bc8ec2271688
          path: .ci-vcpkg
      - name: Prepare Android toolchain
        run: |
          test -d "$ANDROID_NDK_HOME"
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/.ci-vcpkg" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$(basename "$ANDROID_NDK_HOME")" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          .ci-vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Cache Android dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: android-arm64-android-29-${{ env.NDK_VERSION }}-${{ hashFiles('contrib/ci/android/*') }}
      - name: Build Android arm64
        run: |
          cmake -S build -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/contrib/ci/android" \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/contrib/ci/android" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DI2PD_BUILD_JNI=ON -DWITH_BINARY=OFF -DWITH_HARDENING=ON \
            -DI2PD_OPENSSL_EXPECT=OpenSSL
          cmake --build build-android --parallel 2 --target i2pd_jni
          file build-android/libi2pd.so | grep 'ARM aarch64'
      - name: Android unit tests and Lint
        run: |
          cd android
          ./gradlew :i2pd:testDebugUnitTest :i2pd:lintDebug --no-daemon \
            -Pi2pd.ndkVersion="$NDK_VERSION" \
            -Pi2pd.abis=arm64-v8a \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pi2pd.cmakeArgs="$I2PD_ANDROID_CMAKE_ARGS"
      - name: Generate and check Android Javadoc
        run: |
          cd android
          ./gradlew :i2pd:sourceJavadoc --no-daemon \
            -Pi2pd.ndkVersion="$NDK_VERSION" \
            -Pi2pd.abis=arm64-v8a \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pi2pd.cmakeArgs="$I2PD_ANDROID_CMAKE_ARGS"
      - name: Assert Android JVM tests actually ran
        run: |
          test -n "$(find android/app/build/test-results/testDebugUnitTest -name '*.xml' -print -quit)"
          ! grep -R -E '<(failure|error)' android/app/build/test-results/testDebugUnitTest
      - name: Assert Java 25 class-file output
        run: |
          class_file=$(find android/app/build/intermediates/javac/debug -name RouterService.class -print -quit)
          test -n "$class_file"
          javap_out=$(mktemp)
          javap -verbose "$class_file" > "$javap_out"
          grep -q 'major version: 69' "$javap_out" \
            || { echo "RouterService.class is not class-file major 69" >&2; exit 1; }
          rm -f "$javap_out"
      - name: Build debug APK for arm64
        run: |
          cd android
          ./gradlew :i2pd:assembleDebug :i2pd:assembleDebugAndroidTest \
            :i2pd:assembleRelease :i2pd:lintRelease --no-daemon \
            -Pi2pd.ndkVersion="$NDK_VERSION" \
            -Pi2pd.abis=arm64-v8a \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pi2pd.cmakeArgs="$I2PD_ANDROID_CMAKE_ARGS"
          find_application_apk() {
            variant=$1
            while IFS= read -r -d '' candidate; do
              case "$candidate" in
                *androidTest*) continue ;;
                *"$variant"*|*"${variant^}"*) ;;
                *) continue ;;
              esac
              contents=$(unzip -Z1 "$candidate" 2>/dev/null) || continue
              if grep -Fxq 'lib/arm64-v8a/libi2pd.so' <<<"$contents" \
                && grep -Fxq 'assets/i2pd.conf' <<<"$contents" \
                && grep -Eq '^classes([0-9]+)?\.dex$' <<<"$contents"; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done < <(find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print0)
            return 1
          }
          apk=$(find_application_apk debug) || {
            echo "debug app APK with arm64 JNI library not found; APK outputs present:" >&2
            find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print >&2
            exit 1
          }
          printf 'I2PD_DEBUG_APK=%s\n' "$apk" >> "$GITHUB_ENV"
          listing=$(unzip -l "$apk")
          printf '%s\n' "$listing" | grep -q 'lib/arm64-v8a/libi2pd.so' \
            || { echo "debug APK does not package lib/arm64-v8a/libi2pd.so" >&2; exit 1; }
          printf '%s\n' "$listing" | grep -q 'lib/arm64-v8a/libc++_shared.so' \
            || { echo "debug APK does not package libc++_shared.so" >&2; exit 1; }
          printf '%s\n' "$listing" | grep -q 'assets/i2pd.conf' \
            || { echo "debug APK does not package the bundled i2pd.conf" >&2; exit 1; }
          expected_certs=$(find ../contrib/certificates -type f -name '*.crt' | wc -l | tr -d ' ')
          actual_certs=$(printf '%s\n' "$listing" | grep -cE 'assets/certificates/.*\.crt$' || true)
          test "$actual_certs" -eq "$expected_certs" \
            || { echo "APK has $actual_certs certificates, expected $expected_certs" >&2; exit 1; }
          unzip -p "$apk" classes.dex | od -An -t x1 -N4 | grep -q '64 65 78 0a' \
            || { echo "debug APK classes.dex has no dex magic" >&2; exit 1; }
          native=$(mktemp)
          unzip -p "$apk" lib/arm64-v8a/libi2pd.so > "$native"
          file "$native" | grep -q 'ARM aarch64' \
            || { echo "packaged libi2pd.so is not aarch64" >&2; exit 1; }
          nm -D --defined-only "$native" | grep -q 'Java_org_openi2pd_router_I2PD' \
            || { echo "packaged libi2pd.so exports no JNI entry points" >&2; exit 1; }
          rm -f "$native"
          if ! find_application_apk release >/dev/null; then
            echo "release app APK with arm64 JNI library not found; APK outputs present:" >&2
            find "$GITHUB_WORKSPACE" -type f -name '*.apk' -print >&2
            exit 1
          fi
      - name: Probe Java 25 D8/R8 dexing
        run: |
          # assembleDebug above invokes AGP's D8 and resolves the exact
          # R8 artifact selected by AGP 9.4.1. Unit tests and lint alone
          # do not necessarily resolve it, so discover it only after app
          # dexing.
          # AGP may publish R8 under com.android.tools or
          # com.android.tools.build; search the whole Gradle user home rather
          # than one Maven group. Fall back to the SDK build-tools D8/R8 jar
          # when the dependency cache was restored without the artifact.
          R8_JAR=$(find "$HOME/.gradle" -type f \( -name 'r8-*.jar' -o -name 'r8.jar' \) \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit 2>/dev/null || true)
          if [ -z "$R8_JAR" ]; then
            sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            if [ -n "$sdk_root" ]; then
              R8_JAR=$(find "$sdk_root/build-tools" -type f \( -name 'r8*.jar' -o -name 'd8.jar' \) -print -quit 2>/dev/null || true)
            fi
          fi
          if [ -z "$R8_JAR" ]; then
            echo "AGP-resolved R8 jar not found in the Gradle cache after assembleDebug" >&2
            find "$HOME/.gradle" -type f -name 'r8*.jar' -print 2>/dev/null | head -20 >&2 || true
            exit 1
          fi
          test -f "$ANDROID_JAR"
          ANDROID_JAR="$ANDROID_JAR" R8_JAR="$R8_JAR" \
            sh android/tools/java25-probe/verify-java25.sh
      - name: Show Android lint report on failure
        if: failure()
        run: |
          for report in android/app/build/reports/lint-results-debug.txt android/app/build/reports/lint-results-release.txt; do
            if [ -f "$report" ]; then cat "$report"; fi
          done
      - name: Check Android JNI declarations
        run: perl android/tools/check-android-jni-symbols.pl
      - name: Verify Java 25 dex lowering
        run: |
          apk="$I2PD_DEBUG_APK"
          dex=$(mktemp)
          unzip -p "$apk" classes.dex > "$dex"
          version=$(od -An -t u1 -j4 -N3 "$dex" | tr -d ' \n')
          test "$version" = "485157" \
            || { echo "APK classes.dex is not DEX 039 (got $version)" >&2; exit 1; }
          # D8 must remove the record superclass, record ObjectMethods
          # bootstrap and the sealed type-switch/MatchException
          # references at minSdk 29. A surviving reference would fail on
          # ART 10.
          strings_out=$(mktemp)
          strings "$dex" > "$strings_out"
          if grep -Eq 'java/lang/Record|ObjectMethods|SwitchBootstraps|MatchException' "$strings_out"; then
            echo "DEX still contains a Java 25 bootstrap unavailable on ART 29" >&2
            rm -f "$strings_out" "$dex"
            exit 1
          fi
          rm -f "$strings_out" "$dex"
      - name: Stage Android APK artifacts
        if: always()
        run: |
          mkdir -p android-apk-artifacts
          find "$GITHUB_WORKSPACE" -type f -name '*.apk' \
            ! -path "$GITHUB_WORKSPACE/android-apk-artifacts/*" -print0 |
            while IFS= read -r -d '' apk; do
              relative=${apk#"$GITHUB_WORKSPACE"/}
              mkdir -p "android-apk-artifacts/$(dirname "$relative")"
              cp "$apk" "android-apk-artifacts/$relative"
            done
      - name: Upload Android reports and APKs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: android-arm64-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
            android-apk-artifacts
            android/**/build/outputs/apk
            android/app/build/docs/javadoc
          if-no-files-found: warn
          retention-days: 7

  android-ui:
    name: Android API 29 UI and accessibility
    # Opt-in at dispatch time. This lane needs an x86_64 native build
    # plus an API 29 system image, so a normal Android dispatch stays
    # arm64-only. It exercises the prepared Espresso/contract tests on a
    # real ART image; it is not evidence for the arm64 device matrix.
    if: ${{ inputs.android_ui == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      I2PD_ANDROID_CMAKE_ARGS: >-
        -DWITH_HARDENING=ON
        -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x86_64-android
        -DBOOST_ROOT=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x86_64-android
        -DBOOST_INCLUDEDIR=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x86_64-android/include
        -DBOOST_LIBRARYDIR=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x86_64-android/lib
        -DBoost_INCLUDE_DIR=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x86_64-android/include
        -DBoost_LIBRARY_DIR_RELEASE=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x86_64-android/lib
        -DBoost_LIBRARY_DIR_DEBUG=${{ github.workspace }}/build-android-x86_64/vcpkg_installed/x86_64-android/lib
        -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH
        -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH
        -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up OpenJDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache Gradle distributions and dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-ui-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', 'android/gradle.properties') }}
      - name: Validate Android Gradle toolchain
        run: |
          sh android/tools/java25-probe/check-config.sh
          perl android/tools/check-android-locales.pl
          perl android/tools/check-android-jni-symbols.pl
          cd android
          ./gradlew --version --no-daemon
      - name: Install SDK, emulator and API 29 image
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set" >&2
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;30.0.16248370" \
            "emulator" \
            "system-images;android-29;google_apis;x86_64" \
            "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/platform-tools/adb"
      - name: Checkout vcpkg
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          repository: microsoft/vcpkg
          ref: bf19794383e8fb95eba5aa553235bc8ec2271688
          path: .ci-vcpkg
      - name: Prepare Android toolchain
        run: |
          test -d "$ANDROID_NDK_HOME"
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/.ci-vcpkg" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$(basename "$ANDROID_NDK_HOME")" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          .ci-vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Cache Android x86_64 dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: android-x86_64-android-29-${{ env.NDK_VERSION }}-${{ hashFiles('contrib/ci/android/*') }}
      - name: Build Android x86_64
        run: |
          cmake -S build -B build-android-x86_64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/contrib/ci/android" \
            -DVCPKG_TARGET_TRIPLET=x86_64-android \
            -DVCPKG_CMAKE_SYSTEM_VERSION=29 \
            -DVCPKG_BUILD_TYPE=release \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DI2PD_BUILD_JNI=ON -DWITH_BINARY=OFF -DWITH_HARDENING=ON \
            -DI2PD_OPENSSL_EXPECT=OpenSSL
          cmake --build build-android-x86_64 --parallel 2 --target i2pd_jni
          file build-android-x86_64/libi2pd.so | grep 'x86-64'
      - name: Boot API 29 emulator
        run: |
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if [ ! -x "$AVDMANAGER" ]; then
            AVDMANAGER="$(command -v avdmanager)"
          fi
          test -x "$AVDMANAGER"
          echo "no" | "$AVDMANAGER" create avd --force --name openi2pd-api29 \
            --package "system-images;android-29;google_apis;x86_64" --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd openi2pd-api29 -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          timeout 180 "$ADB" wait-for-device
          timeout 420 bash -c "until [ \"\$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')\" = 1 ]; do sleep 3; done" \
            || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          "$ADB" shell input keyevent 82
          "$ADB" shell getprop ro.build.version.sdk
      - name: Run UI and accessibility instrumentation tests
        run: |
          cd android
          ./gradlew :i2pd:connectedDebugAndroidTest --no-daemon \
            -Pi2pd.ndkVersion="$NDK_VERSION" \
            -Pi2pd.abis=x86_64 \
            -Pandroid.injected.build.abi=x86_64 \
            -Pi2pd.cmakeArgs="$I2PD_ANDROID_CMAKE_ARGS"
          results=app/build/outputs/androidTest-results/connected
          test -n "$(find "$results" -name '*.xml' -print -quit)" \
            || { echo "connectedDebugAndroidTest produced no XML report" >&2; exit 1; }
          ! grep -R -E '<(failure|error)' "$results"
      - name: Collect emulator diagnostics on failure
        if: failure()
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" logcat -d -v threadtime > "$RUNNER_TEMP/logcat.txt" || true
          cat "$RUNNER_TEMP/emulator.log" 2>/dev/null || true
      - name: Upload Android UI reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: android-api29-ui-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/androidTest-results
            android/app/build/test-results
          if-no-files-found: warn
          retention-days: 7
