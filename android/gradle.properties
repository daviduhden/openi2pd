#
# openi2pd: gradle.
#
# Android Gradle settings for AndroidX, parallel builds, disabled JDK
# auto-download and disabled built-in Kotlin support.
#

# openi2pd Android build settings.
android.useAndroidX=true
org.gradle.parallel=true
# Never download a JDK or toolchain implicitly.
org.gradle.java.installations.auto-download=false
# Fail fast on unsupported JDK versions instead of using a daemon with one.
# The check lives in android/build.gradle; a locally installed JDK 25 is still
# required for the Java toolchain because auto-download stays disabled.
#
# AGP 9.4.1 resolves Kotlin 2.2.10, whose highest JVM target is 24. It creates a
# Kotlin compile task for every app and derives jvmTarget from the Java target,
# so Java 25 fails task creation with "Unknown Kotlin JVM target: 25" even
# though this app contains no Kotlin sources. Disable built-in Kotlin instead
# of lowering the Java language level; see docs/android-java25.md.
android.builtInKotlin=false
