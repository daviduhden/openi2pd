#
# openi2pd: gradle.
#
# Android Gradle settings for AndroidX, parallel builds, disabled JDK
# auto-download and disabled built-in Kotlin support.
#

# openi2pd Android build settings.
android.useAndroidX=true
org.gradle.parallel=true
# AAPT2, R8 and the CMake native link can otherwise exhaust the default
# daemon heap on a CI runner. Bound the workers as well so a four-core
# runner does not run several native links concurrently.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
# Never download a JDK or toolchain implicitly.
org.gradle.java.installations.auto-download=false
# Fail fast on unsupported JDK versions instead of using a daemon with
# one. The check lives in android/build.gradle; a locally installed JDK
# 25 is still required for the Java toolchain because auto-download
# stays disabled.
