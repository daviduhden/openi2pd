 * license details.
 *
 * openi2pd: build.
 *
 * Declares the buildscript repositories and the pinned AGP classpath
 * shared by the Android module, and aborts configuration when the
 * Gradle JVM is older than JDK 25. A root clean task deletes the root
 * build directory.
 *
 */

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 9.4 is the current stable line (October 2026).
        classpath 'com.android.tools.build:gradle:9.4.1'
    }
}

def minimumJdk = 25
def currentJdk = JavaVersion.current().majorVersion.toInteger()
if (currentJdk < minimumJdk) {
    throw new GradleException(
        "openi2pd Android requires OpenJDK ${minimumJdk} or newer to run Gradle " +
        "(found ${JavaVersion.current()}). Set JAVA_HOME to a JDK ${minimumJdk}+ installation.")
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

// Report the R8 artifact actually selected by AGP. Cache traversal can
// select an older SDK/Gradle artifact that cannot read Java 25 classes.
// Capture the resolved file collection without reading Project at task
// execution, so this report also works with the configuration cache.
def java25R8Artifacts = buildscript.configurations.classpath.incoming.artifactView {
    componentFilter { component ->
        component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                component.module == 'r8'
    }
}.files
def java25R8Report = layout.buildDirectory.file('reports/java25/r8-classpath.txt')
tasks.register('writeJava25R8Classpath') {
    inputs.files(java25R8Artifacts)
    outputs.file(java25R8Report)
    doLast {
        def artifacts = java25R8Artifacts.files
        if (artifacts.size() != 1) {
            throw new GradleException('Expected exactly one AGP-resolved R8 artifact')
        }
        def report = java25R8Report.get().asFile
        report.parentFile.mkdirs()
        report.setText(artifacts.iterator().next().absolutePath + '\n', 'UTF-8')
    }
}
