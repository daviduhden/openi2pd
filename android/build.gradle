 * license details.
 *
 * openi2pd: build.
 *
 * Declares the buildscript repositories and the pinned AGP classpath
 * shared by the Android module, and aborts configuration when the
 * Gradle JVM is older than JDK 25. A root clean task deletes the root
 * build directory.
 *
 */

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 9.4 is the current stable line (October 2026).
        classpath 'com.android.tools.build:gradle:9.4.1'
    }
}

def minimumJdk = 25
def currentJdk = JavaVersion.current().majorVersion.toInteger()
if (currentJdk < minimumJdk) {
    throw new GradleException(
        "openi2pd Android requires OpenJDK ${minimumJdk} or newer to run Gradle " +
        "(found ${JavaVersion.current()}). Set JAVA_HOME to a JDK ${minimumJdk}+ installation.")
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

// AGP bundles R8 by default, so a separate Maven module need not exist.
// Use the containers of its actual loaded entry points, not cache order.
// Capture plain files before task execution to avoid retaining a loader
// or querying Project from a configuration-cache task action.
def java25AgpLoader = com.android.build.gradle.AppPlugin.class.classLoader
def java25D8Container = new File(java25AgpLoader.loadClass('com.android.tools.r8.D8').protectionDomain.codeSource.location.toURI())
def java25R8Container = new File(java25AgpLoader.loadClass('com.android.tools.r8.R8').protectionDomain.codeSource.location.toURI())
def java25R8Report = layout.buildDirectory.file('reports/java25/r8-classpath.txt')
tasks.register('writeJava25R8Classpath') {
    inputs.files(java25D8Container, java25R8Container)
    outputs.file(java25R8Report)
    doLast {
        if (!java25D8Container.isFile() ||
                java25D8Container.canonicalFile != java25R8Container.canonicalFile) {
            throw new GradleException('Expected D8 and R8 in one AGP-loaded JAR')
        }
        def report = java25R8Report.get().asFile
        report.parentFile.mkdirs()
        report.setText(java25D8Container.canonicalPath + '\n', 'UTF-8')
    }
}
