#
# openi2pd: i2pd.
#
# Default Android router configuration. Paths use app-specific storage.
#

## Configuration file for a typical openi2pd user
## See docs/user-guide/configuration.md for more options.

## Paths resolve in app-specific storage; the app does not request
## external-storage permission.
#logfile = i2pd.log
loglevel = none
#tunnelsdir = tunnels.d

# host = 1.2.3.4
# port = 4567

ipv4 = true
ipv6 = false

ssu = false

bandwidth = L
# share = 100

# notransit = true
# floodfill = true

[ntcp2]
enabled = true

[ssu2]
enabled = true
published = true

[tui]
## The Android app has no ncurses client.
enabled = false

[httpproxy]
enabled = true
address = 127.0.0.1
port = 4444
inbound.length = 1
inbound.quantity = 5
outbound.length = 1
outbound.quantity = 5
signaturetype=7
i2cp.leaseSetType=3
i2cp.leaseSetEncType=0,4
keys = proxy-keys.dat
# addresshelper = true
# outproxy = http://false.i2p
## I2CP parameters such as inbound.length are also accepted here.

[socksproxy]
enabled = true
address = 127.0.0.1
port = 4447
keys = proxy-keys.dat
# outproxy.enabled = false
# outproxy = 127.0.0.1
# outproxyport = 9050
## I2CP parameters such as inbound.length are also accepted here.

[sam]
enabled = false
# address = 127.0.0.1
# port = 7656

[precomputation]
elgamal = false

[upnp]
## Enabled by default on Android. The router asks the local gateway for
## NTCP2/SSU2 port mappings and can be disabled from Settings.
enabled = true
name = openi2pd

[reseed]
verify = true
## Path to local reseed data file (.su3) for manual reseeding
# file = /path/to/i2pseeds.su3
## or HTTPS URL to reseed from
# file = https://legit-website.com/i2pseeds.su3
## Path to local ZIP file or HTTPS URL to reseed from
# zipfile = /path/to/netDb.zip
## If the router uses a proxy, set the reseed proxy here.
## Should be http://address:port or socks://address:port
# proxy = http://127.0.0.1:8118
## Reseed below this known-router count; the default is 25.
# threshold = 25

[limits]
transittunnels = 50

[persist]
profiles = false
