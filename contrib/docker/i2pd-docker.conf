#
# openi2pd: i2pd docker.
#
# Container defaults enable file logs, published NTCP2/SSU2, proxy and
# SAM services, and reseed verification.
#
# `log = file` with `loglevel = none` emits no records. Docker captures
# only stdout/stderr; use `log = stdout` or raise the file log level and
# inspect the mounted data volume.
#
# `ipv6 = false` matches Docker's default bridge. Do not publish an IPv6
# address unless the container has a configured IPv6 address; otherwise
# peers see an unreachable endpoint.
#
# `published = true` advertises transport addresses in RouterInfo. Peers
# can reach them only when the operator publishes matching UDP/TCP ports
# with `-p`/`--publish`.
#
# Proxy and SAM listeners bind 0.0.0.0 for container port forwarding.
# Anyone reaching a published port can use these services; publish only
# on a trusted interface.
#
# `[tui] enabled = false`: the container has no terminal client, and
# the private IPC socket has no consumer inside the container.
#
# `[upnp] enabled = false`: Docker bridges have no UPnP IGD; port
# mapping belongs to the container orchestrator.
#
# `[reseed] verify = true` requires valid .su3 signatures. The image
# includes trust anchors linked into the data volume by the entrypoint.
#

## Preconfigured router settings for a Docker container.
## See docs/user-guide/configuration.md for other options.

## Services must bind to 0.0.0.0 for container port forwarding.
## Publish exposed admin/proxy ports only on trusted interfaces.

log = file
loglevel = none

ipv4 = true
ipv6 = false

# bandwidth = L
# notransit = false
# floodfill = false

[ntcp2]
enabled = true
published = true

[ssu2]
enabled = true
published = true

[tui]
## The container has no terminal; keep the local IPC socket disabled.
enabled = false

[httpproxy]
enabled = true
address = 0.0.0.0
port = 4444

[socksproxy]
enabled = true
address = 0.0.0.0
port = 4447

[sam]
enabled = true
address = 0.0.0.0
port = 7656

[upnp]
enabled = false

[reseed]
verify = true

[limits]
# transittunnels = 2500
