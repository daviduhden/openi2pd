#
# openi2pd: i2pd docker.
#
# Container router configuration selecting file logging, published NTCP2/SSU2,
# proxy and SAM services, and reseed verification.
#
# `log = file` with `loglevel = none` discards every record, so `docker logs`
# stays empty: Docker only captures the container's own stdout/stderr. To follow
# the router, raise the level and read the file inside the data volume, or select
# `log = stdout` and read the container log instead.
#
# `ipv6 = false` matches Docker's default bridge, which carries no IPv6 address
# unless the daemon is configured for it. Publishing an IPv6 address that does
# not exist makes the router look reachable while peers cannot connect.
#
# `published = true` on both transports only advertises them in the RouterInfo:
# reachability still needs the matching UDP/TCP port published by the operator
# (`-p`/`--publish`).
#
# The proxies and the SAM bridge bind 0.0.0.0 so a published port reaches them
# through the container network namespace. That also makes them usable by anyone
# who can reach the published port, so publish to a trusted interface only.
#
# `[tui] enabled = false`: the container has no terminal and the 0600 IPC socket
# would live inside the container namespace with no consumer.
#
# `[upnp] enabled = false`: there is no UPnP IGD on the bridge network and port
# mapping belongs to the orchestrator.
#
# `[reseed] verify = true` keeps fail-closed .su3 verification; the image ships
# the trust anchors and the entrypoint links them into the volume.
#

## Preconfigured openi2pd configuration file for a Docker container
## See docs/ in the openi2pd source tree
## for more options you can use in this file.

## Note that for exposing ports outside of container you need to bind all services to 0.0.0.0

log = file
loglevel = none

ipv4 = true
ipv6 = false

# bandwidth = L
# notransit = false
# floodfill = false

[ntcp2]
enabled = true
published = true

[ssu2]
enabled = true
published = true

[tui]
## The container has no terminal; keep the local IPC socket disabled.
enabled = false

[httpproxy]
enabled = true
address = 0.0.0.0
port = 4444

[socksproxy]
enabled = true
address = 0.0.0.0
port = 4447

[sam]
enabled = true
address = 0.0.0.0
port = 7656

[upnp]
enabled = false

[reseed]
verify = true

[limits]
# transittunnels = 2500
