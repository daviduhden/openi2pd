# openi2pd: i2pd.conf (tmpfiles.d).
#
# Directory policy for the service account. CMake installs this file as
# lib/tmpfiles.d/openi2pd.conf when I2PD_SERVICE_MANAGER=systemd; the Debian
# package builds with -DI2PD_SERVICE_MANAGER=none and ships the same three
# lines as debian/i2pd.tmpfiles, so keep both files in step.
#
# The three paths, modes and owner/group repeat the packaged unit's
# StateDirectory=, RuntimeDirectory= and LogsDirectory= (all 0700, i2pd:i2pd),
# so a start action does not depend on tmpfiles having run first. /var/lib/i2pd
# holds keys, netDb, profiles, torrents and the default TUI socket;
# /run/i2pd holds the pidfile and IPC sockets; /var/log/i2pd exists for an
# opt-in file log. None of them may be group- or world-accessible, and the
# router itself runs unprivileged, so the owner must stay i2pd.
#
# Plain `d` entries create these directories only: they do not recurse into
# existing state, and the trailing "-" disables age-based cleanup. Do not add
# cleanup or recursive-chown rules here; keys, netDb and torrent state must
# survive restarts.
d /var/lib/i2pd 0700 i2pd i2pd -
d /run/i2pd 0700 i2pd i2pd -
d /var/log/i2pd 0700 i2pd i2pd -
