#
# openi2pd: i2pd.conf (sysusers.d).
#
# Service account contract: one system user `i2pd` with an automatically
# allocated uid and ids, a group of the same name, a recorded home of
# /var/lib/i2pd and /usr/sbin/nologin so the account can never be used
# for an interactive login. An existing account is left untouched; this
# file never rewrites credentials.
#
# CMake installs it as lib/sysusers.d/openi2pd.conf when
# I2PD_SERVICE_MANAGER=systemd. Debian installs the debian/i2pd.sysusers
# symlink through dh_installsysusers because it builds with
# -DI2PD_SERVICE_MANAGER=none.
#
# The home field is recorded on the account only; sysusers does not
# create the directory. contrib/tmpfiles.d/i2pd.conf owns the 0700
# i2pd:i2pd directories, and /var/lib/i2pd must belong to this account
# because the router writes its keys, netDb, torrent state and pidfile
# there.
u i2pd - "openi2pd router" /var/lib/i2pd /usr/sbin/nologin
