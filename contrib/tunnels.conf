# openi2pd: tunnels.
#
# Sample tunnel configuration with IRC-ILITA enabled.
# See docs/user-guide/tunnels.md for client and server examples.
#

[IRC-ILITA]
type = client
address = 127.0.0.1
port = 6668
destination = irc.ilita.i2p
destinationport = 6667
keys = irc-keys.dat
i2p.streaming.profile=2

