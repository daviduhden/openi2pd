#
# openi2pd: i2pd.
#
# OpenBSD configuration using /etc/i2pd paths, /var/i2pd state, and
# syslog output.
#

## Configuration file for a typical openi2pd user
## See docs/user-guide/configuration.md for the full reference.

## Lines that begin with "## " try to explain what's going on. Lines
## that begin with just "#" are disabled commands: you can enable them
## by removing the "#" symbol.

## Router data directory. The rc.d script passes this path explicitly.
datadir = /var/i2pd

## Tunnels config file
## Default: ~/.i2pd/tunnels.conf or /var/i2pd/tunnels.conf
tunconf = /etc/i2pd/tunnels.conf

## Tunnels config files path
## Use that path to store separated tunnels in different config files.
## Default: ~/.i2pd/tunnels.d or /var/i2pd/tunnels.d
tunnelsdir = /etc/i2pd/tunnels.conf.d

## Certificate directory for .su3 and router-family verification.
## Default: ~/.i2pd/certificates or /var/i2pd/certificates
## The rc.d script passes the packaged read-only certificate tree.
certsdir = /usr/local/share/i2pd/certificates

## PID file defaults to <datadir>/i2pd.pid; the service uses
## /var/i2pd/i2pd.pid. The service account must be able to write it.
# pidfile = /var/i2pd/i2pd.pid

## Logging configuration.
## Unix logs to stdout at info or higher by default.
## Windows writes warn-and-higher messages to a file by default.
##
## Logs destination (valid values: stdout, file, syslog)
##  * stdout - print log entries to stdout
##  * file - log entries to a file
##  * syslog - use syslog, see man 3 syslog
log = syslog
## Path to logfile (default: autodetect)
# logfile = /var/log/i2pd/i2pd.log
## Log messages at or above this level: debug, info, warn, error,
## critical, or none. Setting none disables logging.
# loglevel = warn
## Write full CLF-formatted dates to logs; default is time only.
# logclftime = true

## Start in the background after initialization; ignored on Windows.
## OpenBSD rc.d passes --foreground; keep this disabled for supervised
## starts. Default: false.
# daemon = true

## Specify a family, router belongs to (default - none)
# family =

## Network interface to bind to
## Updates address4/6 options if they are not set
# ifname =
## You can specify different interfaces for IPv4 and IPv6
# ifname4 =
# ifname6 =

## Local address to bind transport sockets to
## Overrides host option if:
## For ipv4: if ipv4 = true and nat = false
## For ipv6: if 'host' is not set or ipv4 = true
# address4 =
# address6 =

## External IPv4 or IPv6 address to listen for connections
## By default i2pd sets IP automatically
## Sets published NTCP2v4/SSUv4 address to 'host' value if nat = true
## Sets published NTCP2v6/SSUv6 address to 'host' value if ipv4 = false
# host = 1.2.3.4

## Port to listen for connections
## By default i2pd picks random port and listens on it.
## If you want to change the port, you MUST pick a random number too,
## don't just uncomment this
# port = 4567

## Enable communication through ipv4 (default: true)
ipv4 = true
## Enable communication through ipv6 (default: false)
ipv6 = false

## Bandwidth codes: L=32, O=256, P=2048 KB/s; X is unlimited.
## The default is L, or X in floodfill mode.
## Integer values set a custom KB/s cap and use the next higher code;
## for example, 4096 uses code X with a 4096 KB/s cap.
## Low floodfill limits may reduce peer scores in Java routers.
# bandwidth = L
## Max % of bandwidth limit for transit. 0-100 (default: 100)
# share = 100

## Router will not accept transit tunnels, disabling transit traffic
## completely
## (default: false)
# notransit = true

## Router will be floodfill (default: false)
## Note: that mode uses much more network connections and CPU!
# floodfill = true

## For places with limited connectivity (default: false)
# stan = true

[ntcp2]
## Enable NTCP2 transport (default: true)
# enabled = true
## Publish address in RouterInfo (default: true)
# published = true
## Port for incoming connections (default is global port option value)
# port = 4567

[ssu2]
## Enable SSU2 transport (default: true)
# enabled = true
## Publish address in RouterInfo (default: true)
# published = true
## Port for incoming connections (default is global port option value)
# port = 4567

[privsep]
## The log worker is isolated; network, storage, and core are not.
## OpenBSD spawns the supervisor and log worker before runtime pledge.
## Each worker installs its pledge/unveil policy after execve.
## Workers refuse root; run the service as _i2pd.
# enabled = false
# log = true
## Unprivileged worker identity. Children drop to this identity before
## worker setup and report it in a one-shot hello. A root-started daemon
## must set it; empty keeps the daemon identity.
# user = _i2pd
# group = _i2pd
## Delegate fixed router files / runtime artifacts to storage workers.
# routerstorage = false
# artifacts = false

[tui]
## Local read-only TUI socket (default:
## /var/i2pd/i2pd-tui.sock).
# enabled = true
# socket = /var/i2pd/i2pd-tui.sock

[httpproxy]
## Enable the HTTP proxy (default: true)
# enabled = true
## Address and port service will listen on (default: 127.0.0.1:4444)
# address = 127.0.0.1
# port = 4444
## Key file for the proxy destination (default: transient-proxy).
## A transient destination changes on each application launch.
## Set a filename such as http-proxy-keys.dat to keep a stable address.
# keys = http-proxy-keys.dat
## Accept jump URLs to add .i2p addresses (default: true).
## Disable this on a public proxy: address helpers can register a
## spoofed short name and redirect users to phishing sites.
# addresshelper = true
## I2P outproxy used to reach the public Internet.
# outproxy = http://false.i2p
## This section also accepts I2CP options such as "inbound.length".

[socksproxy]
## Enable the SOCKS proxy (default: true)
# enabled = true
## Address and port service will listen on (default: 127.0.0.1:4447)
# address = 127.0.0.1
# port = 4447
## Key file for the proxy destination (default: transient-proxy).
## A transient destination changes on each application launch.
## Set a filename such as socks-proxy-keys.dat to keep a stable address.
# keys = socks-proxy-keys.dat
## SOCKS4 outproxy; the example routes non-I2P traffic through Tor.
## Enable SOCKS outproxy (works only with SOCKS4, default: false)
# outproxy.enabled = false
## Address and port of outproxy
# outproxy = 127.0.0.1
# outproxyport = 9050
## socksproxy section also accepts I2CP parameters, like
## "inbound.length" etc.

[sam]
## Enable the SAM bridge (default: true)
# enabled = false
## SAM addresses: TCP 127.0.0.1:7656 and UDP 7655 by default.
# address = 127.0.0.1
# port = 7656
# portudp = 7655

[bob]
## Enable the BOB command channel (default: false)
# enabled = false
## Address and port service will listen on (default: 127.0.0.1:2827)
# address = 127.0.0.1
# port = 2827

[i2cp]
## Enable the I2CP protocol (default: false)
# enabled = false
## Address and port service will listen on (default: 127.0.0.1:7654)
# address = 127.0.0.1
# port = 7654

[i2pcontrol]
## Enable the I2PControl protocol (default: false)
# enabled = false
## Address and port service will listen on (default: 127.0.0.1:7650)
# address = 127.0.0.1
# port = 7650
## Authentication password (default: itoopie)
# password = itoopie

[precomputation]
## Enable or disable elgamal precomputation table
## By default, enabled on i386 hosts
# elgamal = true

[upnp]
## Enable UPnP port forwarding (enabled by default on Windows/Android).
# enabled = false
## Name openi2pd appears in UPnP forwardings list (default: openi2pd)
# name = openi2pd

[meshnets]
## Enable connectivity over the Yggdrasil network  (default: false)
# yggdrasil = false
## You can bind address from your Yggdrasil subnet 300::/64
## The address must first be added to the network interface
# yggaddress =

[reseed]
## Options for bootstrapping into I2P network, aka reseeding
## Enable reseed data verification (default: true)
verify = true
## URLs to request reseed data from, separated by comma
## Unset uses the built-in mainline I2P reseed list.
# urls = https://reseed2.i2p.net/,https://reseed.diva.exchange/
## Reseed URLs through the Yggdrasil, separated by comma
## When not set, the built-in list is used
# yggurls = http://[324:71e:281a:9ed3::ace]:7070/
## Path to local reseed data file (.su3) for manual reseeding
# file = /path/to/i2pseeds.su3
## HTTPS URLs are kept as URLs rather than treated as local paths.
## A local .su3 file remains available for offline reseeding.
# file = https://legit-website.com/i2pseeds.su3
## Local ZIP reseed file; HTTPS ZIP URLs are not implemented.
# zipfile = /path/to/netDb.zip
## Proxy for reseeding; use http://address:port or
## socks://address:port.
# proxy = http://127.0.0.1:8118
## Start reseeding below this known-router count (default: 25).
# threshold = 25
## Follow redirects when reseeding from URLs (default: false)
# followredirect = false

[addressbook]
## AddressBook subscription URL for initial setup
## Default: reg.i2p at "mainline" I2P Network
# defaulturl = http://shx5vqsw7usdaunyzr2qmes2fq37oumybpudrd4jjj4e4vk4uusa.b32.i2p/hosts.txt
## Optional subscriptions URLs, separated by comma
# subscriptions = http://reg.i2p/hosts.txt,http://identiguy.i2p/hosts.txt,http://stats.i2p/cgi-bin/newhosts.txt

[limits]
## Maximum active transit sessions (default: 25000)
## This value is doubled if floodfill mode is enabled!
# transittunnels = 25000
## Limit number of open file descriptors (0 - use system limit)
# openfiles = 0
## Maximum size of corefile in Kb (0 - use system limit)
# coresize = 0

[trust]
## Enable explicit trust options. (default: false)
# enabled = true
## Make direct I2P connections only to routers in specified Family.
# family = MyFamily
## Make direct I2P connections only to routers specified here. Comma
## separated list of base64 identities.
# routers =
## Should we hide our router from other routers? (default: false)
## Note: this is not an overall hidden mode
# hidden = true

[exploratory]
## Exploratory tunnels settings with default values
# inbound.length = 2
# inbound.quantity = 3
# outbound.length = 2
# outbound.quantity = 3

[persist]
## Save peer profiles on disk (default: true)
# profiles = true
## Save full addresses on disk (default: true)
# addressbook = true
