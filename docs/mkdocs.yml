# See the LICENSE file at the top of the project tree for copyright
# and license details.
#
# openi2pd: mkdocs.
#
# MkDocs configuration that publishes the documentation tree to
# build-output/docs with fixed navigation and the openi2pd brand stylesheet.
#

# Optional static-publication configuration. The daemon, CMake build, TUI and
# tests do not invoke MkDocs or require it at runtime.
---
site_name: openi2pd documentation
site_description: Documentation for the openi2pd router, libraries, TUI and tools
site_author: openi2pd contributors
docs_dir: .
site_dir: ../build-output/docs
exclude_docs: |
  /README.md
  /UPSTREAM-README.md
  /devs/building/ios.md
  /devs/building/qt-desktop-gui.md
  /devs/building/haikuos.md
extra_css:
  - stylesheets/brand.css

repo_url: https://github.com/daviduhden/openi2pd

nav:
  - Home: index.md
  - Fork documentation:
      - Branding:
          - Overview: branding/README.md
          - Logo usage: branding/logo-usage.md
          - Colors: branding/colors.md
          - Assets: branding/assets.md
      - Architecture: architecture.md
      - Architecture decisions: architecture/README.md
      - Interoperability: INTEROPERABILITY.md
      - Functional parity: FEATURE-PARITY.md
      - Dependencies: dependencies.md
      - C++23: cpp23-migration.md
      - Build system: build-system.md
      - Static build audit: static-build-audit.md
      - TUI and IPC: tui-ipc.md
      - TUI on Windows: TUI-WINDOWS.md
      - Native torrent console:
          - Architecture: torrent/architecture.md
          - TUI: torrent/tui.md
          - IPC: torrent/ipc.md
          - Security: torrent/security.md
          - Functionality matrix: torrent/console-matrix.md
          - I2PSnark compatibility: torrent/snark-compatibility.md
          - Local state: torrent/local-state.md
          - Storage worker: torrent/storage-worker.md
          - Router storage: torrent/router-storage.md
          - Android SAF payload storage: torrent/saf-storage.md
          - Testing: torrent/testing.md
      - Language policy: i18n.md
      - Perl migration: development/perl-migration.md
      - Android modernization: android-modernization.md
      - Android JNI status: android-jni-status.md
      - Android Java 25: android-java25.md
      - Security audit: security-audit.md
      - Testing: testing.md
      - OpenBSD validation: security/openbsd-validation.md
      - CI policy: ci.md
      - Files changed: files-changed.md
      - Attribution audit: attribution-audit.md
      - Rebranding audit: REBRANDING.md
      - Upstream synchronization: upstream-sync.md
  - User Guide:
      - Installing: user-guide/install.md
      - Running: user-guide/run.md
      - Service management: service-management.md
      - Configuring: user-guide/configuration.md
      - I2P tunnels: user-guide/tunnels.md
      - Family: user-guide/family.md
      - FAQ: user-guide/FAQ.md
  - How-To / Tutorials:
      - Anonymous websites: tutorials/http.md
      - Anonymous IRC: tutorials/irc.md
      - XMPP: tutorials/xmpp.md
      - Monero over I2P: tutorials/Monero.md
      - Filesharing:
          - Built-in torrent client:
              - Guide: tutorials/Filesharing/built-in-torrent/built-inTorrent.md
              - JSON-RPC API: tutorials/Filesharing/built-in-torrent/torrents-rpc.md
          - Software: tutorials/Filesharing/Software.md
          - qBittorrent: tutorials/Filesharing/qBittorrent.md
      - RetroShare: tutorials/retroshare.md
      - Yggdrasil-only mode: tutorials/yggdrasil-only-mode.md
      - Encrypted LeaseSet2: tutorials/blinded-addresse.md
      - Glossary: tutorials/glossary.md
  - Tools:
      - Overview: tools/README.md
      - Provenance and inventory: tools/provenance.md
      - autoconf_i2pd: tools/autoconf_i2pd.md
      - b33address: tools/b33address.md
      - b33offlinekeys: tools/b33offlinekeys.md
      - famtool: tools/famtool.md
      - i2pbase64: tools/i2pbase64.md
      - keygen: tools/keygen.md
      - keyinfo: tools/keyinfo.md
      - offlinekeys: tools/offlinekeys.md
      - regaddr: tools/regaddr.md
      - regaddr_3ld: tools/regaddr_3ld.md
      - regaddralias: tools/regaddralias.md
      - routerinfo: tools/routerinfo.md
      - vain: tools/vain.md
      - verifyhost: tools/verifyhost.md
      - x25519: tools/x25519.md
      - i2pdctl: tools/i2pdctl.md
  - Developer:
      - Guide: developer-guide/README.md
      - Source documentation: source-documentation.md
      - Compilation errors: ci/COMPILATION-ERRORS.md
      - Requirements: devs/building/requirements.md
      - Linux and OpenBSD: devs/building/unix.md
      - Windows: devs/building/windows.md
      - Android app: devs/building/android.md
      - Cross compilation: devs/building/cross.md
      - API selection: devs/api/index.md
      - SAM: devs/api/SAM.md
      - BOB: devs/api/BOB.md
      - I2CP: devs/api/I2CP.md
      - I2PControl: devs/api/I2PControl.md
      - libi2pd: devs/api/libi2pd.md
      - Hacking: devs/hacking.md
      - File headers: file-headers.md
      - i2pd-specific changes: devs/i2pd-specifics.md
  - Protocols: protocols/README.md
  - Security:
      - Overview: security/README.md
      - Privilege separation: security/privilege-separation.md
      - IPC protocol: security/ipc-protocol.md
      - Process capabilities: security/process-capabilities.md
      - Windows worker IPC: security/windows-worker-ipc.md
      - Threat model: security/threat-model.md
      - Memory safety and concurrency: security/memory-safety-2026.md
  - About:
      - Community: about/community.md
      - History: about/history.md
      - License: about/license.md
      - Contributing: about/contributing.md

copyright: BSD-3-Clause for router, tools and project documentation; third-party components retain their own licenses.

theme:
  name: readthedocs
  favicon: img/favicon.ico
  logo: img/logo.png

markdown_extensions:
  - toc:
      permalink: true
  - attr_list
